<script>
'use strict';
const CONTENT = {"lessons":[{"id":1,"title":"자산·부채·자본","subject":"재무회계","intro":"카페에 있는 현금과 기계는 자산, 갚아야 할 돈은 부채, 그 차액은 자본이야.","rules":["자산 = 부채 + 자본","자본 = 자산 − 부채","돈으로 기계를 사면 자산의 종류만 바뀌어."],"example":"새 상황: 내 돈 400만 원과 대출 100만 원을 통장에 넣으면 자산 500만 원, 부채 100만 원, 자본 400만 원이야.","trap":"빌린 돈도 지금 보유하고 있다면 자산에 포함돼. 대출은 수익이 아니야."},{"id":2,"title":"차변·대변과 분개","subject":"재무회계","intro":"분개는 거래를 회계 언어로 적는 일이야. 차변은 왼쪽, 대변은 오른쪽이라는 자리 이름이야.","rules":["자산 증가·비용 발생은 차변에 기록해.","부채 증가·자본 증가·수익 발생은 대변에 기록해.","한 거래의 차변 합계와 대변 합계는 반드시 같아."],"example":"새 상황: 현금 100만 원을 빌리면 (차) 현금 100만 원 / (대) 차입금 100만 원이야.","trap":"차변이 무조건 좋은 것, 대변이 무조건 나쁜 것은 아니야. 계정의 종류와 증감을 먼저 봐."},{"id":3,"title":"수익·비용과 결산","subject":"재무회계","intro":"수익과 비용은 돈을 주고받은 날과 항상 같지 않아. 실제로 서비스를 제공하거나 사용한 기간을 봐.","rules":["미수수익: 벌었지만 아직 못 받은 수익.","선수수익: 먼저 받았지만 아직 제공하지 않은 서비스 대가.","선급비용: 먼저 냈지만 아직 사용하지 않은 부분. 미지급비용은 이미 발생했지만 아직 안 낸 비용."],"example":"새 상황: 10월 1일에 1년 보험료 120만 원을 냈다면, 12월 말까지 3개월분 30만 원이 당기 비용이야.","trap":"현금을 받았다는 사실만으로 수익이 되는 건 아니야. 계약금·선수금은 의무가 남아 있어."},{"id":4,"title":"현금과 매출채권","subject":"재무회계","intro":"매출채권은 물건을 팔고 아직 받지 못한 돈이야. 못 받을 위험까지 생각해서 장부금액을 조정해.","rules":["매출채권 순장부금액 = 총액 − 손실충당금.","결산 때 필요한 충당금과 이미 남아 있는 충당금의 차이를 조정해.","현금성자산은 단기·고유동성이며 가치변동 위험이 매우 작은 투자야. 통상 취득일부터 만기 3개월 이내인지 봐."],"example":"새 상황: 매출채권 1,000만 원에 필요한 충당금이 30만 원이고 기존 잔액이 10만 원이면 20만 원을 추가 설정해.","trap":"충당금 필요액 전체를 매번 비용으로 더하는 게 아니야. 기존 잔액을 먼저 확인해."},{"id":5,"title":"재고자산과 매출원가","subject":"재무회계","intro":"팔려고 보유한 상품은 재고자산이야. 그중 판매된 상품의 원가가 매출원가가 돼.","rules":["매출원가 = 기초재고 + 순매입액 − 기말재고.","재고 매입운임은 취득원가에 포함하고 매입환출은 매입액에서 빼.","원가와 순실현가능가치 중 낮은 금액으로 평가해."],"example":"새 상황: 기초재고 100, 순매입 500, 기말재고 150이면 매출원가는 450이야.","trap":"물건을 샀다고 곧바로 모두 비용은 아니야. 아직 남아 있는 판매용 물건은 자산이야."},{"id":6,"title":"유형·무형자산","subject":"재무회계","intro":"오래 쓰는 기계는 사용기간에 걸쳐 원가를 나눠 비용으로 처리해. 이게 감가상각이야.","rules":["정액법 연간 감가상각비 = (취득원가 − 잔존가치) ÷ 내용연수.","처분손익 = 처분대가 − 처분일 장부금액.","연구단계 지출은 비용. 개발단계 지출은 정해진 자산 인식 요건을 모두 충족해야 자산이 돼."],"example":"새 상황: 기계 500만 원, 잔존가치 50만 원, 5년 사용이면 연간 감가상각비는 90만 원이야.","trap":"토지는 일반적으로 감가상각하지 않아. 내용연수가 비한정인 무형자산도 상각 대신 손상검토를 해."},{"id":7,"title":"금융자산과 현재가치","subject":"재무회계","intro":"금융자산은 현금이나 다른 회사의 주식, 돈을 받을 계약상 권리 등을 말해.","rules":["상각후원가 분류는 사업모형과 계약상 현금흐름 요건을 함께 봐.","당기손익-공정가치 측정 자산의 평가손익은 당기손익에 반영해.","현재가치는 미래 돈을 적절한 할인율로 현재 시점 금액으로 바꾼 값이야."],"example":"새 상황: 1년 뒤 받을 110만 원을 연 10%로 할인하면 현재가치는 110 ÷ 1.1 = 100만 원이야.","trap":"모든 금융자산을 같은 방식으로 평가하지 않아. 문제에 나온 분류 조건을 먼저 읽어."},{"id":8,"title":"부채와 사채","subject":"재무회계","intro":"사채는 회사가 투자자에게 발행하는 채무증권이야. 발행금액과 만기 때 갚는 액면금액이 다를 수 있어.","rules":["표시이자 = 액면금액 × 표시이자율.","유효이자비용 = 기초 장부금액 × 유효이자율.","할인발행 사채는 할인액 상각으로 장부금액이 만기 액면금액에 가까워져."],"example":"새 상황: 기초 사채 장부금액 90만 원, 유효이자율 10%, 현금이자 6만 원이면 이자비용 9만 원, 할인액 상각 3만 원이야.","trap":"현금으로 지급하는 이자와 손익계산서 이자비용은 다를 수 있어."},{"id":9,"title":"자본과 주당이익","subject":"재무회계","intro":"주주가 낸 자본과 회사가 벌어 쌓아 둔 이익은 구분해 기록해. 배당은 비용이 아니라 이익의 분배야.","rules":["주식발행초과금 = 발행금액 − 액면금액에 해당하는 자본금.","자기주식은 자산이 아니라 자본 차감 항목.","기본주당이익 = 보통주 귀속 이익 ÷ 가중평균 유통보통주식수."],"example":"새 상황: 액면 5,000원짜리 100주를 8,000원에 발행하면 현금 80만 원, 자본금 50만 원, 발행초과금 30만 원이야.","trap":"자기주식을 샀다고 금융자산으로 잡지 않아. 자기 회사 주식은 자본에서 차감해."},{"id":10,"title":"재무제표와 현금흐름","subject":"재무회계","intro":"재무상태표는 특정 시점의 상태를, 손익계산서는 일정 기간의 성과를 보여줘. 이익과 현금흐름은 서로 달라.","rules":["재무상태표: 자산·부채·자본. 손익계산서: 수익·비용.","기계 구입은 일반적으로 투자활동, 차입금 조달은 재무활동.","간접법에서 비현금 비용인 감가상각비는 이익에 다시 더해."],"example":"새 상황: 순이익 100, 감가상각비 20, 매출채권 증가 10이고 다른 조정이 없으면 영업현금흐름은 110이야.","trap":"외상매출이 늘면 이익은 생겨도 현금은 아직 안 들어올 수 있어. 이익 = 현금이라고 외우면 안 돼."},{"id":11,"title":"원가의 첫 분류","subject":"원가회계","intro":"제품을 만드는 데 든 돈을 재료·노무·제조경비로 나눠 봐. 특정 제품에 바로 연결되는지도 중요해.","rules":["제조원가 = 직접재료원가 + 직접노무원가 + 제조간접원가.","기본원가 = 직접재료원가 + 직접노무원가.","가공원가 = 직접노무원가 + 제조간접원가."],"example":"새 상황: 재료 100, 직접노무 60, 제조간접 40이면 제조원가 200, 기본원가 160, 가공원가 100이야.","trap":"공장 비용과 본사·판매 비용을 구분해. 판매사원 급여는 일반적으로 제조원가가 아니야."},{"id":12,"title":"고정원가·변동원가","subject":"원가회계","intro":"생산량이 달라질 때 총원가와 단위원가가 어떻게 움직이는지 봐. 관련범위 안에서 비교하는 거야.","rules":["변동원가: 단위당은 일정, 총액은 조업도에 비례.","고정원가: 총액은 일정, 단위당은 생산량이 늘면 감소.","총원가 = 고정원가 + 단위당 변동원가 × 조업도."],"example":"새 상황: 월 고정비 100만 원, 개당 변동비 2,000원으로 100개를 만들면 총원가 120만 원이야.","trap":"고정원가가 일정하다는 말은 총액 기준이야. 개당 고정원가까지 일정하다는 뜻은 아니야."},{"id":13,"title":"재료에서 제품까지","subject":"원가회계","intro":"재료를 공정에 넣으면 재공품, 완성하면 제품, 판매하면 매출원가로 옮겨 가.","rules":["당기총제조원가 = 직접재료 + 직접노무 + 제조간접.","당기제품제조원가 = 기초재공품 + 당기총제조원가 − 기말재공품.","매출원가 = 기초제품 + 당기제품제조원가 − 기말제품."],"example":"새 상황: 기초재공품 20, 당기총제조원가 100, 기말재공품 30이면 완성품 제조원가는 90이야.","trap":"재공품은 아직 만드는 중인 제품이야. 제품 재고와 재공품 재고를 섞어서 계산하지 마."},{"id":14,"title":"재료원가 계산","subject":"원가회계","intro":"재료를 구입한 금액과 실제 생산에 사용한 금액은 달라. 남아 있는 재료를 빼야 사용액이 돼.","rules":["재료 사용액 = 기초재료 + 당기 순매입액 − 기말재료.","직접재료는 제품에 직접 추적하고 간접재료는 제조간접원가에 넣어.","매입운임은 취득원가, 매입환출·할인은 매입원가 차감 항목으로 봐."],"example":"새 상황: 기초재료 30, 순매입 100, 기말재료 20이면 재료 사용액은 110이야.","trap":"총재료 사용액에 간접재료가 포함되어 있다면 직접재료를 구할 때 따로 빼야 해."},{"id":15,"title":"노무원가 계산","subject":"원가회계","intro":"생산직 근로자에게 지급하는 금액도 제품과 직접 연결되는지에 따라 나눠. 지급액과 발생액도 구분해.","rules":["발생 노무원가 = 지급액 + 기말미지급액 − 기초미지급액.","직접 작업시간 × 시간당 임률로 직접노무원가를 계산할 수 있어.","공장 감독자 급여 등은 일반적으로 간접노무원가야."],"example":"새 상황: 급여 지급 100, 기초미지급 10, 기말미지급 20이면 당기 발생 급여는 110이야.","trap":"지난달 급여를 이번 달 지급한 부분은 이번 달 발생 노무원가에서 빼야 해."},{"id":16,"title":"제조간접원가 배부","subject":"원가회계","intro":"공장 전기료처럼 여러 제품에 함께 드는 원가는 합리적인 기준으로 제품에 나눠 줘. 이걸 배부라고 해.","rules":["예정배부율 = 예상 제조간접원가 ÷ 예상 배부기준 총량.","예정배부액 = 예정배부율 × 실제 사용한 배부기준량.","실제 발생액이 배부액보다 크면 과소배부, 작으면 과대배부야."],"example":"새 상황: 예상 간접원가 100만 원, 예상 기계시간 500시간이면 시간당 2,000원이야. 20시간 쓴 제품에는 4만 원을 배부해.","trap":"예정배부율의 분모는 예상량, 배부액 계산에 곱하는 건 실제 사용량이야."},{"id":17,"title":"부문별 원가계산","subject":"원가회계","intro":"보조부문은 수선실처럼 제조부문을 돕는 곳이야. 보조부문 원가를 제조부문에 배분한 뒤 제품에 나눠 줘.","rules":["직접배분법: 보조부문 상호 서비스를 무시하고 제조부문에만 배분.","단계배분법: 정한 순서에 따라 배분하고 이미 배분한 부문으로 되돌리지 않아.","상호배분법: 보조부문 사이 상호 서비스까지 반영해."],"example":"새 상황: 수선부 원가 60만 원을 제조 A 100시간, B 200시간에 따라 직접배분하면 A 20만 원, B 40만 원이야.","trap":"직접배분법에서는 다른 보조부문에 제공한 서비스량을 배분 분모에서 제외해."},{"id":18,"title":"개별원가계산","subject":"원가회계","intro":"주문 제작 가구처럼 주문마다 다른 제품은 작업별로 원가를 모아. 주문 A와 주문 B를 따로 계산하는 거야.","rules":["작업원가 = 직접재료 + 직접노무 + 배부된 제조간접원가.","작업 단위원가 = 작업 총원가 ÷ 해당 작업 생산수량.","미완성 작업은 기말재공품, 완성 후 미판매 작업은 제품 재고야."],"example":"새 상황: 주문 A의 재료 50, 노무 30, 간접원가 배부 20이면 작업원가 100이야.","trap":"미완성 작업의 원가를 바로 매출원가에 넣지 않아. 재공품에 남겨 둬."},{"id":19,"title":"종합원가·완성품환산량","subject":"원가회계","intro":"동일 제품을 연속 생산하면 공정 전체 원가를 나눠. 덜 만든 재공품은 완성품 몇 개 분량인지로 바꿔 계산해.","rules":["평균법 완성품환산량 = 완성품 수량 + 기말재공품 수량 × 완성도.","재료와 가공원가는 투입 시점이 달라 환산량을 따로 계산할 수 있어.","선입선출법은 당기 수행한 작업량을 따로 구분해."],"example":"새 상황: 완성품 100개, 기말재공품 20개, 가공완성도 50%이면 평균법 가공환산량은 110개야.","trap":"재료를 공정 초기에 전량 투입했다면 기말재공품의 재료완성도는 100%야. 가공완성도와 달라."},{"id":20,"title":"결합원가와 원가 판단","subject":"원가회계","intro":"하나의 공정에서 여러 제품이 함께 나오면 분리되기 전까지의 공통 원가를 나눠야 해.","rules":["결합원가는 분리점 전까지 여러 제품에 공통으로 발생한 원가야.","물량기준법은 수량 비율, 상대적 판매가치법은 판매가치 비율로 배분해.","추가가공 여부는 추가수익과 추가원가를 비교해. 이미 발생한 결합원가는 그 결정에서 매몰원가야."],"example":"새 상황: 결합원가 90만 원, 분리점 판매가치 A 200·B 100이면 A에 60만 원, B에 30만 원을 배분해.","trap":"추가가공 판단에 이미 발생한 공통 원가를 다시 더해서 비교하면 결론이 틀릴 수 있어."}],"questions":[{"id":"01-01","lesson":1,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 내 돈 400만 원과 은행 대출 100만 원을 통장에 넣었다. 자산은?","choices":["500만 원","400만 원","100만 원","300만 원"],"correct":0,"explanation":"보유 현금은 400 + 100 = 500만 원. 그중 100만 원은 부채야."},{"id":"01-02","lesson":1,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 자산 900만 원, 부채 350만 원이다. 자본은?","choices":["550만 원","1,250만 원","350만 원","900만 원"],"correct":0,"explanation":"자본 = 자산 900 − 부채 350 = 550만 원."},{"id":"01-03","lesson":1,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 현금 500만 원 중 200만 원으로 기계를 샀다. 구매 직후 총자산은?","choices":["500만 원","200만 원","300만 원","700만 원"],"correct":0,"explanation":"현금 300 + 기계 200 = 500만 원. 자산끼리 바뀌었어."},{"id":"01-04","lesson":1,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 현금 500만 원, 부채 100만 원이다. 현금으로 부채 전액을 갚으면 자산과 부채는?","choices":["자산 400만 원·부채 0원","자산 500만 원·부채 0원","자산 400만 원·부채 100만 원","자산 600만 원·부채 0원"],"correct":0,"explanation":"현금과 빚이 각각 100만 원 줄어. 자본 400만 원은 그대로야."},{"id":"01-05","lesson":1,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 주주가 현금 300만 원을 출자했다. 회사의 자산과 자본 변화는?","choices":["자산·자본 각각 300만 원 증가","자산·부채 각각 증가","자산 증가·자본 감소","수익 300만 원 증가"],"correct":0,"explanation":"출자는 소유주와의 거래이므로 자본을 늘려. 매출수익으로 기록하지 않아."},{"id":"01-06","lesson":1,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 기초 자본 600만 원, 당기순이익 80만 원, 현금배당 30만 원이다. 다른 변동이 없다면 기말 자본은?","choices":["650만 원","710만 원","680만 원","570만 원"],"correct":0,"explanation":"600 + 이익 80 − 배당 30 = 650만 원."},{"id":"01-07","lesson":1,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 외상으로 기계 150만 원을 샀다. 총자산과 부채는?","choices":["각각 150만 원 증가","각각 150만 원 감소","자산만 150만 원 증가","둘 다 변동 없음"],"correct":0,"explanation":"기계가 늘고 미지급금도 늘어. 자본에는 즉시 영향이 없어."},{"id":"01-08","lesson":1,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 자산 1,200만 원, 자본 750만 원이다. 부채는?","choices":["450만 원","1,950만 원","750만 원","1,200만 원"],"correct":0,"explanation":"부채 = 자산 1,200 − 자본 750 = 450만 원."},{"id":"02-01","lesson":2,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"자산이 증가할 때 기록하는 쪽은?","choices":["차변","대변","아무 쪽이나 가능","기록하지 않음"],"correct":0,"explanation":"자산은 증가하면 차변, 감소하면 대변이야."},{"id":"02-02","lesson":2,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"수익이 발생했을 때 일반적으로 기록하는 쪽은?","choices":["대변","차변","자산의 차변","비용의 차변"],"correct":0,"explanation":"수익은 대변에 발생하고, 비용은 차변에 발생해."},{"id":"02-03","lesson":2,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 현금으로 임차료 20만 원을 지급했다. 올바른 분개는?","choices":["(차) 임차료 20 / (대) 현금 20","(차) 현금 20 / (대) 임차료 20","(차) 차입금 20 / (대) 현금 20","(차) 임차료 20 / (대) 자본금 20"],"correct":0,"explanation":"비용인 임차료가 차변, 감소한 현금이 대변이야. 금액 단위는 만 원."},{"id":"02-04","lesson":2,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 은행에서 50만 원을 빌려 현금으로 받았다. 분개는?","choices":["(차) 현금 50 / (대) 차입금 50","(차) 현금 50 / (대) 매출 50","(차) 차입금 50 / (대) 현금 50","(차) 비용 50 / (대) 현금 50"],"correct":0,"explanation":"현금 증가 차변, 부채 증가 대변. 빌린 돈은 매출이 아니야."},{"id":"02-05","lesson":2,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 외상매출금 40만 원을 현금으로 회수했다. 분개는?","choices":["(차) 현금 40 / (대) 외상매출금 40","(차) 현금 40 / (대) 매출 40","(차) 외상매출금 40 / (대) 현금 40","(차) 매입채무 40 / (대) 매출 40"],"correct":0,"explanation":"받을 돈이 현금으로 바뀌었어. 이미 인식한 매출을 다시 기록하면 안 돼."},{"id":"02-06","lesson":2,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 차변에 현금 60만 원과 비품 40만 원을 기록했다. 대변 합계는?","choices":["100만 원","20만 원","60만 원","40만 원"],"correct":0,"explanation":"복식부기에서는 차변 합계 60 + 40과 대변 합계가 같아."},{"id":"02-07","lesson":2,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 상품을 외상으로 매입했다. 계속기록법에서 기본 분개는?","choices":["(차) 상품 / (대) 매입채무","(차) 매입채무 / (대) 상품","(차) 상품 / (대) 매출","(차) 매출 / (대) 현금"],"correct":0,"explanation":"판매용 재고자산이 늘고 지급할 채무도 늘어."},{"id":"02-08","lesson":2,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 차입금 30만 원을 현금으로 상환했다. 차변 계정은?","choices":["차입금","현금","매출","이자수익"],"correct":0,"explanation":"부채인 차입금 감소는 차변, 자산인 현금 감소는 대변이야."},{"id":"03-01","lesson":3,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 12월에 서비스를 제공하고 대금은 다음 해 1월에 받는다. 수익 인식 시점은?","choices":["12월","다음 해 1월","계약서를 쓴 달만 가능","현금 수령 전에는 불가능"],"correct":0,"explanation":"서비스 제공을 완료해 수익 인식 요건을 충족한 12월에 인식해."},{"id":"03-02","lesson":3,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"아직 제공하지 않은 서비스의 대금을 먼저 받았다. 기본적인 성격은?","choices":["부채","자본","당기 비용","현금 감소"],"correct":0,"explanation":"서비스를 제공해야 하는 의무가 남아 있으므로 선수수익 또는 계약부채가 돼."},{"id":"03-03","lesson":3,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 다음 해에 사용할 보험료를 미리 냈다. 결산일 현재 미사용분은?","choices":["선급비용","미지급비용","미수수익","이자수익"],"correct":0,"explanation":"앞으로 효익을 받을 수 있는 미사용 보험료는 자산인 선급비용이야."},{"id":"03-04","lesson":3,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 10월 1일에 1년분 보험료 120만 원을 지급했다. 12월 31일 결산 때 당기 보험료는? 월할 계산한다.","choices":["30만 원","120만 원","90만 원","10만 원"],"correct":0,"explanation":"월 10만 원 × 10·11·12월 3개월 = 30만 원. 나머지 90만 원은 선급비용."},{"id":"03-05","lesson":3,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 당기 수익 800만 원, 비용 550만 원이다. 당기순이익은?","choices":["250만 원","1,350만 원","550만 원","800만 원"],"correct":0,"explanation":"순이익 = 수익 − 비용 = 800 − 550 = 250만 원."},{"id":"03-06","lesson":3,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 12월분 급여 90만 원을 다음 해에 지급할 예정이다. 결산 때 인식할 것은?","choices":["급여비용과 미지급비용","급여비용과 선급비용","현금과 매출","미수수익과 급여수익"],"correct":0,"explanation":"올해 근로 제공으로 발생한 비용을 올해 반영하고 미지급 의무를 부채로 잡아."},{"id":"03-07","lesson":3,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 이자수익 8만 원이 당기에 발생했으나 아직 받지 못했다. 결산분개는?","choices":["(차) 미수수익 8 / (대) 이자수익 8","(차) 현금 8 / (대) 이자수익 8","(차) 이자비용 8 / (대) 미지급비용 8","(차) 선수수익 8 / (대) 현금 8"],"correct":0,"explanation":"받을 권리인 미수수익과 당기 이자수익을 인식해."},{"id":"03-08","lesson":3,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 전액 선수수익으로 기록한 60만 원 중 20만 원에 해당하는 서비스를 제공했다. 결산 조정은?","choices":["선수수익 20 감소·수익 20 증가","현금 20 증가·수익 20 증가","비용 20 증가·자본 20 감소","선수수익 60 감소·수익 60 증가"],"correct":0,"explanation":"서비스를 제공한 부분만 의무가 사라지고 수익이 돼."},{"id":"04-01","lesson":4,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"외상으로 상품을 팔고 받을 돈을 나타내는 것은?","choices":["매출채권","매입채무","차입금","자본금"],"correct":0,"explanation":"판매해서 받을 돈은 매출채권, 매입하고 지급할 돈은 매입채무야."},{"id":"04-02","lesson":4,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"매출채권에서 손실충당금을 차감하는 주된 이유는?","choices":["회수하지 못할 위험을 반영하려고","현금을 늘리려고","매출을 항상 취소하려고","차입금을 줄이려고"],"correct":0,"explanation":"채권의 회수가능성을 반영한 순장부금액을 표시하기 위해서야."},{"id":"04-03","lesson":4,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 매출채권 500만 원, 손실충당금 20만 원이다. 순장부금액은?","choices":["480만 원","520만 원","500만 원","20만 원"],"correct":0,"explanation":"500 − 20 = 480만 원."},{"id":"04-04","lesson":4,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 필요한 충당금 30만 원, 기존 대변 잔액 10만 원이다. 추가 설정액은?","choices":["20만 원","30만 원","40만 원","10만 원"],"correct":0,"explanation":"목표 잔액 30 − 기존 잔액 10 = 20만 원만 추가해."},{"id":"04-05","lesson":4,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 충당금 대변 잔액 15만 원이 있다. 회수 불능 채권 10만 원을 충당금과 상계하면 충당금 잔액은?","choices":["대변 5만 원","대변 25만 원","차변 5만 원","대변 15만 원"],"correct":0,"explanation":"충당금 15 − 사용액 10 = 대변 잔액 5만 원."},{"id":"04-06","lesson":4,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"현금성자산의 만기 3개월 기준은 일반적으로 어느 시점부터 계산하는가?","choices":["취득일","결산일","회사 설립일","투자상품 발행일만"],"correct":0,"explanation":"일반적으로 취득일부터 만기까지가 단기인지 판단해. 만기가 짧아도 다른 요건도 충족해야 해."},{"id":"04-07","lesson":4,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 매출채권 800만 원, 추정 손실률 2%, 기존 충당금 6만 원이다. 추가 설정액은? 단순 비율을 적용한다.","choices":["10만 원","16만 원","22만 원","6만 원"],"correct":0,"explanation":"필요 잔액 800 × 2% = 16만 원. 16 − 6 = 10만 원."},{"id":"04-08","lesson":4,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"외상매출금을 현금으로 회수하면 총자산은 어떻게 되는가? 다른 조정은 없다.","choices":["변하지 않는다","회수액만큼 증가","회수액만큼 감소","항상 두 배가 된다"],"correct":0,"explanation":"매출채권 감소와 현금 증가가 같은 금액이라 총자산은 그대로야."},{"id":"05-01","lesson":5,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 기초재고 100만 원, 순매입 500만 원, 기말재고 150만 원이다. 매출원가는?","choices":["450만 원","750만 원","550만 원","350만 원"],"correct":0,"explanation":"100 + 500 − 150 = 450만 원."},{"id":"05-02","lesson":5,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"상품의 취득원가에 일반적으로 포함되는 것은?","choices":["매입운임","판매 후 고객에게 보내는 배송비","본사 광고비","판매사원 급여"],"correct":0,"explanation":"상품을 현재 장소와 상태에 이르게 하는 매입운임은 재고 취득원가야."},{"id":"05-03","lesson":5,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"원가 80만 원, 순실현가능가치 70만 원인 재고의 평가액은?","choices":["70만 원","80만 원","150만 원","10만 원"],"correct":0,"explanation":"원가와 순실현가능가치 중 낮은 70만 원으로 평가해."},{"id":"05-04","lesson":5,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 10개를 개당 1,000원에, 이후 10개를 개당 1,200원에 샀다. 다른 재고 없이 12개를 판매했다. 선입선출법 매출원가는?","choices":["12,400원","13,200원","14,400원","12,000원"],"correct":0,"explanation":"먼저 산 10개 × 1,000 + 다음 2개 × 1,200 = 12,400원."},{"id":"05-05","lesson":5,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 10개 × 1,000원, 이후 10개 × 1,200원을 매입하고 그 뒤에 12개를 판매했다. 평균법상 매출원가는? 다른 재고는 없다.","choices":["13,200원","12,400원","14,400원","11,000원"],"correct":0,"explanation":"평균단가 = 총 22,000원 ÷ 20개 = 1,100원. 판매 12개 × 1,100 = 13,200원."},{"id":"05-06","lesson":5,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"기말재고를 실제보다 20만 원 크게 평가했다. 다른 조건이 같다면 당기 매출원가는?","choices":["20만 원 과소계상","20만 원 과대계상","변화 없음","40만 원 과대계상"],"correct":0,"explanation":"매출원가 식에서 기말재고를 빼므로 기말재고가 커지면 매출원가는 작아져."},{"id":"05-07","lesson":5,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 매입가 200만 원, 매입환출 20만 원, 매입운임 10만 원이다. 취득원가는?","choices":["190만 원","230만 원","180만 원","210만 원"],"correct":0,"explanation":"200 − 환출 20 + 매입운임 10 = 190만 원."},{"id":"05-08","lesson":5,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 예상 판매가 100만 원, 추가 완성원가 8만 원, 판매에 필요한 원가 7만 원이다. 순실현가능가치는?","choices":["85만 원","100만 원","115만 원","92만 원"],"correct":0,"explanation":"예상 판매가 − 완성원가 − 판매원가 = 100 − 8 − 7 = 85만 원."},{"id":"06-01","lesson":6,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"감가상각의 핵심 목적은?","choices":["상각대상금액을 사용기간에 배분","매년 시가로 평가","현금을 별도로 적립","모든 자산을 즉시 비용 처리"],"correct":0,"explanation":"감가상각은 자산 원가의 기간배분이야. 단순 시가평가와 달라."},{"id":"06-02","lesson":6,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"일반적으로 감가상각하지 않는 자산은?","choices":["토지","건물","차량","기계장치"],"correct":0,"explanation":"통상 내용연수가 제한되지 않는 토지는 감가상각 대상이 아니야."},{"id":"06-03","lesson":6,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 기계 취득원가 500만 원, 잔존가치 50만 원, 내용연수 5년이다. 정액법 연간 상각비는?","choices":["90만 원","100만 원","110만 원","50만 원"],"correct":0,"explanation":"(500 − 50) ÷ 5 = 90만 원."},{"id":"06-04","lesson":6,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 연간 상각비 120만 원인 자산을 7월 1일부터 사용했다. 월할 계산 시 그해 상각비는?","choices":["60만 원","120만 원","30만 원","90만 원"],"correct":0,"explanation":"7~12월 6개월 사용. 120 × 6/12 = 60만 원."},{"id":"06-05","lesson":6,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 취득원가 600만 원, 누적 상각 240만 원인 기계를 400만 원에 처분했다. 처분손익은?","choices":["이익 40만 원","손실 200만 원","이익 160만 원","손실 40만 원"],"correct":0,"explanation":"장부금액 600 − 240 = 360. 처분대가 400 − 360 = 이익 40만 원."},{"id":"06-06","lesson":6,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"연구단계 지출의 일반적인 회계처리는?","choices":["발생한 기간의 비용","항상 무형자산","항상 재고자산","자본금 증가"],"correct":0,"explanation":"연구단계 지출은 발생 시 비용 처리해. 개발단계와 구분해야 해."},{"id":"06-07","lesson":6,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"내용연수가 비한정인 무형자산의 일반적 처리는?","choices":["상각하지 않고 손상검토","무조건 5년 상각","매년 전액 비용","감가상각누계액을 토지로 대체"],"correct":0,"explanation":"비한정 내용연수 무형자산은 상각하지 않고 정기적으로 손상검사를 해."},{"id":"06-08","lesson":6,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"임대수익이나 시세차익을 얻기 위해 보유한 부동산의 일반적 분류는?","choices":["투자부동산","재고자산으로만 분류","매출채권","무형자산"],"correct":0,"explanation":"자가사용 부동산·통상 영업과정 판매용 부동산과 구분해. 투자부동산은 별도 평가모형을 적용해."},{"id":"07-01","lesson":7,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"다음 중 금융자산에 해당하는 것은?","choices":["다른 회사의 주식","회사가 쓰는 기계","판매용 상품","특허권"],"correct":0,"explanation":"다른 회사의 지분상품은 금융자산에 해당해."},{"id":"07-02","lesson":7,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 1년 후 받을 110만 원을 연 10%로 할인한다. 현재가치는?","choices":["100만 원","110만 원","121만 원","90만 원"],"correct":0,"explanation":"110 ÷ (1 + 0.1) = 100만 원."},{"id":"07-03","lesson":7,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"미래 수취액과 기간이 같을 때 할인율이 높아지면 현재가치는?","choices":["감소","증가","항상 같음","항상 0원"],"correct":0,"explanation":"미래금액을 더 큰 할인계수로 나누므로 현재가치가 작아져."},{"id":"07-04","lesson":7,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 당기손익-공정가치 측정 주식의 기초 장부금액 100만 원, 기말 공정가치 120만 원이다. 매매·배당이 없다면 평가손익은?","choices":["평가이익 20만 원","평가손실 20만 원","자본금 20만 원 증가","평가손익 없음"],"correct":0,"explanation":"FVTPL에서는 공정가치 변동 120 − 100 = 20만 원을 당기손익에 반영해."},{"id":"07-05","lesson":7,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"당기손익-공정가치 측정 금융자산 취득 거래원가의 일반적 처리는?","choices":["즉시 당기 비용","항상 취득원가에 가산","자본금으로 기록","매출채권과 상계"],"correct":0,"explanation":"FVTPL 금융자산은 거래원가를 취득원가에 더하지 않고 당기손익으로 처리해."},{"id":"07-06","lesson":7,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 상각후원가 금융자산의 기초 장부금액 100만 원, 유효이자율 8%이다. 1년간 이자수익은? 중간 변동은 없다.","choices":["8만 원","10만 원","80만 원","108만 원"],"correct":0,"explanation":"기초 상각후원가 100 × 유효이자율 8% = 8만 원."},{"id":"07-07","lesson":7,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"상각후원가 측정의 요건 판단에 필요한 조합은?","choices":["보유 사업모형과 계약상 현금흐름 특성","주식 이름과 거래소 위치","회사 로고와 주가","현금 보유량과 직원 수"],"correct":0,"explanation":"원금·이자만의 현금흐름인지와 계약상 현금흐름 수취 사업모형인지 등을 함께 판단해."},{"id":"07-08","lesson":7,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 2년 뒤 받을 121만 원, 연 할인율 10%이다. 현재가치는?","choices":["100만 원","110만 원","121만 원","90만 원"],"correct":0,"explanation":"121 ÷ 1.1² = 100만 원. 두 기간을 할인해."},{"id":"08-01","lesson":8,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"사채 발행 시 회사의 기본적인 의무는?","choices":["약정 이자와 원금 지급","의결권 제공만","배당금 무조건 지급","항상 상품 인도"],"correct":0,"explanation":"사채는 채무상품이므로 계약에 따른 원리금 지급 의무가 생겨."},{"id":"08-02","lesson":8,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 액면 100만 원, 표시이자율 연 6%이다. 연간 현금이자는?","choices":["6만 원","10만 원","60만 원","106만 원"],"correct":0,"explanation":"현금이자 = 액면금액 100 × 6% = 6만 원."},{"id":"08-03","lesson":8,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"사채를 액면금액보다 낮은 금액으로 발행하는 것은?","choices":["할인발행","할증발행","무상증자","주식배당"],"correct":0,"explanation":"발행금액이 액면보다 작으면 할인발행이야."},{"id":"08-04","lesson":8,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 기초 사채 장부금액 90만 원, 연 유효이자율 10%이다. 1년 이자비용은?","choices":["9만 원","6만 원","10만 원","90만 원"],"correct":0,"explanation":"유효이자비용 = 기초 장부금액 90 × 10% = 9만 원."},{"id":"08-05","lesson":8,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 할인발행 사채의 당기 이자비용 9만 원, 현금이자 6만 원이다. 할인액 상각액은?","choices":["3만 원","15만 원","6만 원","9만 원"],"correct":0,"explanation":"할인액 상각 = 유효이자비용 − 현금이자 = 9 − 6 = 3만 원."},{"id":"08-06","lesson":8,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 할인사채 기초 장부금액 90만 원, 당기 할인액 상각 3만 원이다. 기말 장부금액은?","choices":["93만 원","87만 원","90만 원","103만 원"],"correct":0,"explanation":"할인발행 사채 장부금액은 할인액 상각만큼 늘어나 만기 액면금액에 접근해."},{"id":"08-07","lesson":8,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"다른 조건이 같을 때 시장이자율이 표시이자율보다 높으면 사채는 일반적으로?","choices":["할인발행","할증발행","반드시 액면발행","반드시 발행 불가"],"correct":0,"explanation":"지급하는 이자가 시장 요구수익률보다 낮으므로 발행가격이 액면보다 낮아져."},{"id":"08-08","lesson":8,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"충당부채를 인식할 조건으로 적절한 것은?","choices":["현재의무·자원유출 가능성 높음·신뢰성 있는 추정","미래 계획만 있으면 충분","현금이 나갔을 때만 가능","금액이 불확실하면 항상 금지"],"correct":0,"explanation":"과거사건에 따른 현재의무, 높은 자원유출 가능성, 신뢰성 있는 추정 요건을 함께 판단해."},{"id":"09-01","lesson":9,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"주주에게 지급하는 현금배당의 성격은?","choices":["이익의 분배","급여비용","매출원가","차입금 이자"],"correct":0,"explanation":"배당은 소유주와의 자본거래이므로 당기 비용이 아니야."},{"id":"09-02","lesson":9,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"회사가 보유한 자기주식의 재무상태표상 성격은?","choices":["자본 차감","유동자산","투자부동산","매출채권"],"correct":0,"explanation":"자기주식은 자기 회사의 지분을 다시 취득한 것이므로 자본 차감 항목이야."},{"id":"09-03","lesson":9,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 액면 5,000원인 보통주 100주를 주당 8,000원에 발행했다. 자본금 증가액은?","choices":["50만 원","80만 원","30만 원","100만 원"],"correct":0,"explanation":"자본금은 액면 5,000 × 100주 = 50만 원."},{"id":"09-04","lesson":9,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 액면 5,000원인 100주를 주당 8,000원에 발행했다. 주식발행초과금은?","choices":["30만 원","50만 원","80만 원","13만 원"],"correct":0,"explanation":"(발행가 8,000 − 액면 5,000) × 100 = 30만 원."},{"id":"09-05","lesson":9,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 당기순이익 1,000만 원, 우선주배당금 100만 원, 가중평균 보통주 10,000주다. 기본주당이익은?","choices":["900원","1,000원","1,100원","100원"],"correct":0,"explanation":"(1,000만 − 100만) ÷ 10,000주 = 900원."},{"id":"09-06","lesson":9,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 1월 1일 보통주 1,000주, 7월 1일에 1,000주를 현금 발행했다. 가중평균주식수는? 다른 변동은 없다.","choices":["1,500주","2,000주","1,000주","500주"],"correct":0,"explanation":"기존 1,000주 × 12/12 + 추가 1,000주 × 6/12 = 1,500주."},{"id":"09-07","lesson":9,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 기초 이익잉여금 200만 원, 당기순이익 70만 원, 현금배당 20만 원이다. 기말 이익잉여금은?","choices":["250만 원","290만 원","270만 원","180만 원"],"correct":0,"explanation":"200 + 70 − 20 = 250만 원."},{"id":"09-08","lesson":9,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 회사가 자기주식 40만 원을 현금으로 취득했다. 총자산과 총자본은?","choices":["각각 40만 원 감소","각각 40만 원 증가","자산만 감소·자본 불변","자산 불변·자본 증가"],"correct":0,"explanation":"현금이 줄고 자기주식이 자본에서 차감돼 총자본도 줄어."},{"id":"10-01","lesson":10,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"특정 시점의 자산·부채·자본을 보여주는 재무제표는?","choices":["재무상태표","손익계산서","현금출납장만","원가명세서만"],"correct":0,"explanation":"재무상태표는 결산일 같은 특정 시점의 재무상태를 보여줘."},{"id":"10-02","lesson":10,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"일정 기간의 수익·비용과 성과를 보여주는 것은?","choices":["손익계산서","재무상태표","차입금명세서만","주주명부"],"correct":0,"explanation":"손익계산서는 회계기간의 경영성과를 표시해."},{"id":"10-03","lesson":10,"subject":"재무회계","level":"기초","kind":"자체 제작","prompt":"기계장치를 현금으로 취득한 현금흐름의 일반적 분류는?","choices":["투자활동","영업활동","재무활동","현금흐름이 아님"],"correct":0,"explanation":"장기 사용 자산의 취득은 일반적으로 투자활동 현금유출이야."},{"id":"10-04","lesson":10,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"은행에서 장기차입금을 받은 현금흐름의 분류는?","choices":["재무활동","투자활동","기타포괄손익","매출활동만"],"correct":0,"explanation":"외부에서 자금을 조달하는 차입은 재무활동이야."},{"id":"10-05","lesson":10,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"간접법 영업현금흐름 계산에서 감가상각비를 더하는 이유는?","choices":["이익에서는 뺐지만 당기 현금유출은 아니므로","실제로 현금을 받았으므로","매출채권이 증가하므로","매출을 취소하므로"],"correct":0,"explanation":"비현금 비용을 순이익에 다시 가산해 현금기준으로 조정해."},{"id":"10-06","lesson":10,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 순이익 100만 원, 감가상각비 20만 원, 매출채권 증가 10만 원이다. 다른 조정 없이 간접법 영업현금흐름은?","choices":["110만 원","130만 원","90만 원","70만 원"],"correct":0,"explanation":"100 + 비현금비용 20 − 아직 못 받은 매출채권 증가 10 = 110만 원."},{"id":"10-07","lesson":10,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"기업이 사용한 종업원 근로에 대한 미지급 급여를 결산에 반영하는 것은 어떤 원칙과 관련되는가?","choices":["발생기준","현금 수령기준","보수 총액을 자본금으로 처리","매출총이익률 기준"],"correct":0,"explanation":"이미 제공받은 근로에 대한 비용은 지급 여부와 별개로 발생한 기간에 인식해."},{"id":"10-08","lesson":10,"subject":"재무회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 매출액 1,000만 원, 매출원가 600만 원, 판매관리비 150만 원이다. 영업이익은? 다른 영업손익은 없다.","choices":["250만 원","400만 원","850만 원","1,750만 원"],"correct":0,"explanation":"매출총이익 1,000 − 600 = 400. 판매관리비 150을 빼면 영업이익 250만 원."},{"id":"11-01","lesson":11,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"특정 제품에 직접 추적할 수 있는 주요 재료비는?","choices":["직접재료원가","판매비","직접노무원가","자본금"],"correct":0,"explanation":"제품과 직접 연결되는 주재료 소비액은 직접재료원가야."},{"id":"11-02","lesson":11,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"일반적인 제조간접원가에 해당하는 것은?","choices":["공장 건물 감가상각비","판매사원 급여","본사 광고비","고객 배송비"],"correct":0,"explanation":"공장 공통 비용으로 개별 제품에 직접 추적하기 어려워 제조간접원가가 돼."},{"id":"11-03","lesson":11,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"가공원가를 구성하는 것은?","choices":["직접노무원가 + 제조간접원가","직접재료원가 + 판매비","재료원가만","매출원가 + 배당금"],"correct":0,"explanation":"재료를 제품으로 가공하는 데 드는 노무와 제조간접원가를 합해."},{"id":"11-04","lesson":11,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 직접재료 100만 원, 직접노무 60만 원, 제조간접 40만 원이다. 제조원가는?","choices":["200만 원","160만 원","100만 원","140만 원"],"correct":0,"explanation":"제조원가 3요소를 합하면 100 + 60 + 40 = 200만 원."},{"id":"11-05","lesson":11,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 직접재료 100만 원, 직접노무 60만 원, 제조간접 40만 원이다. 기본원가는?","choices":["160만 원","200만 원","100만 원","140만 원"],"correct":0,"explanation":"기본원가 = 직접재료 100 + 직접노무 60 = 160만 원."},{"id":"11-06","lesson":11,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 직접재료 100만 원, 직접노무 60만 원, 제조간접 40만 원이다. 가공원가는?","choices":["100만 원","200만 원","160만 원","40만 원"],"correct":0,"explanation":"가공원가 = 직접노무 60 + 제조간접 40 = 100만 원."},{"id":"11-07","lesson":11,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"제품원가가 판매되기 전 일반적으로 포함되는 항목은?","choices":["재고자산","항상 당기 판매비","미수수익","배당금"],"correct":0,"explanation":"제품원가는 재공품·제품 같은 재고자산을 거쳐 판매 때 매출원가가 돼."},{"id":"11-08","lesson":11,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"일반적으로 기간원가에 해당하는 것은?","choices":["본사 광고비","직접재료원가","공장 직접노무원가","제품 제조간접원가"],"correct":0,"explanation":"판매·관리 목적의 광고비는 제품 재고에 포함하지 않고 해당 기간 비용으로 처리해."},{"id":"12-01","lesson":12,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"관련범위 안에서 생산량과 비례해 총액이 변하는 원가는?","choices":["변동원가","고정원가","매몰원가만","자본금"],"correct":0,"explanation":"변동원가 총액은 조업도에 비례하고 단위당 변동원가는 일정하다고 가정해."},{"id":"12-02","lesson":12,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"관련범위 안에서 생산량이 증가하면 단위당 고정원가는?","choices":["감소","증가","언제나 일정","항상 0원"],"correct":0,"explanation":"같은 고정원가 총액을 더 많은 제품에 나누므로 단위당 고정원가가 내려가."},{"id":"12-03","lesson":12,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"관련범위 안에서 단위당 변동원가는 일반적으로?","choices":["일정","생산량에 반비례","생산량의 제곱에 비례","항상 고정원가보다 큼"],"correct":0,"explanation":"원가행태의 기본 모형에서는 단위당 변동원가를 일정하게 봐."},{"id":"12-04","lesson":12,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 월 고정원가 100만 원, 단위당 변동원가 2,000원, 생산량 100개다. 총원가는?","choices":["120만 원","100만 원","200만 원","102만 원"],"correct":0,"explanation":"100만 + 2,000 × 100개 = 120만 원."},{"id":"12-05","lesson":12,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 고정원가 60만 원, 생산량 300개다. 단위당 고정원가는?","choices":["2,000원","200원","20,000원","600원"],"correct":0,"explanation":"600,000 ÷ 300 = 2,000원."},{"id":"12-06","lesson":12,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 생산량이 100개에서 200개로 늘었다. 고정원가 총액이 40만 원으로 일정하다면 단위당 고정원가는?","choices":["4,000원에서 2,000원으로 감소","2,000원에서 4,000원으로 증가","항상 4,000원","항상 2,000원"],"correct":0,"explanation":"400,000/100 = 4,000원, 400,000/200 = 2,000원."},{"id":"12-07","lesson":12,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 총원가 식이 Y = 500,000 + 3,000X이다. X가 생산수량일 때 단위당 변동원가는?","choices":["3,000원","500,000원","503,000원","X원"],"correct":0,"explanation":"식의 상수항이 고정원가, X에 곱해지는 계수가 단위당 변동원가야."},{"id":"12-08","lesson":12,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"고정원가와 변동원가 요소가 함께 있는 원가의 명칭은?","choices":["혼합원가","직접원가만","기회이익","매출채권"],"correct":0,"explanation":"기본요금과 사용량 요금이 같이 있는 전기요금 같은 구조를 생각하면 돼."},{"id":"13-01","lesson":13,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"아직 제조가 끝나지 않은 제품의 원가가 모이는 계정은?","choices":["재공품","매출채권","이익잉여금","완제품 매출만"],"correct":0,"explanation":"가공 중인 미완성품의 제조원가는 재공품에 집계돼."},{"id":"13-02","lesson":13,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"제조가 완료되면 원가가 일반적으로 이동하는 방향은?","choices":["재공품 → 제품","제품 → 재료","매출원가 → 자본금","매출채권 → 재료"],"correct":0,"explanation":"완성된 제조원가를 재공품에서 제품으로 대체해."},{"id":"13-03","lesson":13,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"완성한 제품을 판매하면 제품원가는 어떤 비용으로 이동하는가?","choices":["매출원가","이자비용","광고선전비","배당금"],"correct":0,"explanation":"제품 재고 중 판매된 부분이 매출원가가 돼."},{"id":"13-04","lesson":13,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 기초재공품 20만 원, 당기총제조원가 100만 원, 기말재공품 30만 원이다. 당기제품제조원가는?","choices":["90만 원","150만 원","110만 원","70만 원"],"correct":0,"explanation":"20 + 100 − 30 = 90만 원."},{"id":"13-05","lesson":13,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 기초제품 10만 원, 당기제품제조원가 90만 원, 기말제품 25만 원이다. 매출원가는?","choices":["75만 원","125만 원","105만 원","65만 원"],"correct":0,"explanation":"10 + 90 − 25 = 75만 원."},{"id":"13-06","lesson":13,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 직접재료 50만 원, 직접노무 30만 원, 제조간접 20만 원, 판매비 10만 원이다. 당기총제조원가는?","choices":["100만 원","110만 원","80만 원","70만 원"],"correct":0,"explanation":"제조원가 50 + 30 + 20 = 100만 원. 판매비는 제외해."},{"id":"13-07","lesson":13,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"다른 조건이 같을 때 기말재공품이 10만 원 증가하면 당기제품제조원가는?","choices":["10만 원 감소","10만 원 증가","변화 없음","20만 원 증가"],"correct":0,"explanation":"완성되지 않고 남은 원가가 늘면 완성품으로 이동하는 원가는 줄어."},{"id":"13-08","lesson":13,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 기초제품 40, 기말제품 30, 매출원가 150이다. 당기제품제조원가는? 단위는 만 원.","choices":["140","160","220","80"],"correct":0,"explanation":"150 = 40 + 당기제품제조원가 − 30. 따라서 140이야."},{"id":"14-01","lesson":14,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"재료 사용액 계산에서 차감하는 것은?","choices":["기말재료 재고","기초재료 재고","당기 재료 매입액","매입운임"],"correct":0,"explanation":"쓸 수 있었던 재료에서 사용하지 않고 남은 기말재료를 빼."},{"id":"14-02","lesson":14,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"공장에서 사용하는 소액의 공통 소모성 재료를 제품별 직접 추적하지 않는다면?","choices":["간접재료원가","직접노무원가","판매수익","자본금"],"correct":0,"explanation":"직접 추적하지 않는 제조용 보조재료는 제조간접원가를 구성해."},{"id":"14-03","lesson":14,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 기초재료 30만 원, 순매입 100만 원, 기말재료 20만 원이다. 사용액은?","choices":["110만 원","150만 원","90만 원","70만 원"],"correct":0,"explanation":"30 + 100 − 20 = 110만 원."},{"id":"14-04","lesson":14,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 총재료 사용액 110만 원 중 간접재료 10만 원이다. 직접재료 사용액은?","choices":["100만 원","120만 원","110만 원","10만 원"],"correct":0,"explanation":"총사용액 − 간접재료 = 직접재료. 110 − 10 = 100만 원."},{"id":"14-05","lesson":14,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 매입대가 200만 원, 매입운임 5만 원, 환출 15만 원이다. 순매입원가는?","choices":["190만 원","220만 원","180만 원","205만 원"],"correct":0,"explanation":"200 + 운임 5 − 환출 15 = 190만 원."},{"id":"14-06","lesson":14,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 기초재료 50, 순매입 180, 총사용액 200이다. 기말재료는? 단위는 만 원.","choices":["30","70","430","150"],"correct":0,"explanation":"기말재료 = 50 + 180 − 200 = 30."},{"id":"14-07","lesson":14,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"직접재료를 생산공정에 투입할 때 일반적인 원가 흐름은?","choices":["재료 → 재공품","재료 → 배당금","제품 → 현금","재공품 → 자본금"],"correct":0,"explanation":"원재료 재고가 감소하고 가공 중인 재공품 원가가 증가해."},{"id":"14-08","lesson":14,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 기초재료 20, 매입 120, 기말재료 30, 간접재료 사용액 10이다. 직접재료 사용액은? 단위는 만 원.","choices":["100","110","120","140"],"correct":0,"explanation":"총사용액 20 + 120 − 30 = 110. 간접재료 10을 빼면 직접재료 100."},{"id":"15-01","lesson":15,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"일반적으로 간접노무원가에 해당하는 것은?","choices":["공장 감독자 급여","특정 제품 조립 근로자의 직접 작업임금","제품의 주요 원재료","본사 광고비"],"correct":0,"explanation":"여러 제품의 생산을 지원하는 공장 감독자 급여는 제조간접원가로 분류해."},{"id":"15-02","lesson":15,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"새 상황: 직접 작업시간 100시간, 시간당 임률 15,000원이다. 직접노무원가는?","choices":["150만 원","15만 원","100만 원","1,500만 원"],"correct":0,"explanation":"100 × 15,000 = 1,500,000원."},{"id":"15-03","lesson":15,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"노무원가 발생액 계산에서 지급액에 더하는 것은?","choices":["기말미지급 급여","기초미지급 급여","전기 지급완료 급여","배당금"],"correct":0,"explanation":"당기에 일했지만 아직 지급하지 않은 기말 미지급분을 더해."},{"id":"15-04","lesson":15,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 급여 지급액 100, 기초미지급 10, 기말미지급 20이다. 당기 발생액은? 단위는 만 원.","choices":["110","90","130","100"],"correct":0,"explanation":"지급 100 + 기말미지급 20 − 기초미지급 10 = 110."},{"id":"15-05","lesson":15,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 총공장 노무원가 200만 원 중 간접노무원가 50만 원이다. 직접노무원가는?","choices":["150만 원","250만 원","200만 원","50만 원"],"correct":0,"explanation":"총공장 노무원가에서 간접노무원가를 제외해. 200 − 50 = 150만 원."},{"id":"15-06","lesson":15,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 제품 A 작업 40시간, 제품 B 작업 60시간, 시간당 임률 2만 원이다. A의 직접노무원가는?","choices":["80만 원","120만 원","200만 원","40만 원"],"correct":0,"explanation":"A에 직접 사용한 40시간 × 2만 원 = 80만 원."},{"id":"15-07","lesson":15,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"판매사원 급여를 제조간접원가에 넣는 처리는 일반적으로?","choices":["부적절하다","항상 적절하다","직접재료라서 적절하다","자본금이라서 적절하다"],"correct":0,"explanation":"판매사원 급여는 판매비로, 제조원가에 포함하지 않아."},{"id":"15-08","lesson":15,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 당기 발생 노무원가 130, 기초미지급 20, 기말미지급 10이다. 현금 지급액은? 단위는 만 원.","choices":["140","100","120","160"],"correct":0,"explanation":"발생 130 = 지급 + 기말 10 − 기초 20. 따라서 지급 = 140."},{"id":"16-01","lesson":16,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"예정 제조간접원가 배부율의 기본 계산식은?","choices":["예상 간접원가 ÷ 예상 배부기준량","실제 매출 ÷ 예상 이익","직접재료 ÷ 현금","기말재고 ÷ 차입금"],"correct":0,"explanation":"기간 시작 전에 예상 간접원가와 예상 조업도로 배부율을 정해."},{"id":"16-02","lesson":16,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"제조간접원가 배부기준으로 쓸 수 있는 것은?","choices":["기계작업시간","주주 생일","회사 로고 크기","임원 성명 글자 수"],"correct":0,"explanation":"원가 발생과 관련 있는 기계시간·직접노무시간 등을 합리적으로 선택해."},{"id":"16-03","lesson":16,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"실제 제조간접원가가 예정배부액보다 크면?","choices":["과소배부","과대배부","항상 이익 증가","자본잉여금"],"correct":0,"explanation":"제품에 나눠 준 금액이 실제보다 부족하므로 과소배부야."},{"id":"16-04","lesson":16,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 예상 제조간접원가 100만 원, 예상 기계시간 500시간이다. 시간당 예정배부율은?","choices":["2,000원","200원","5,000원","500원"],"correct":0,"explanation":"1,000,000 ÷ 500 = 시간당 2,000원."},{"id":"16-05","lesson":16,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 예정배부율 시간당 2,000원, 작업 A 실제 기계시간 20시간이다. 배부액은?","choices":["4만 원","2만 원","40만 원","10만 원"],"correct":0,"explanation":"2,000 × 20 = 40,000원."},{"id":"16-06","lesson":16,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 실제 간접원가 120만 원, 예정배부액 100만 원이다. 배부차이는?","choices":["20만 원 과소배부","20만 원 과대배부","220만 원 과소배부","차이 없음"],"correct":0,"explanation":"실제 120 − 배부 100 = 20만 원 부족하게 배부했어."},{"id":"16-07","lesson":16,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 실제 간접원가 90만 원, 예정배부액 100만 원이다. 배부차이는?","choices":["10만 원 과대배부","10만 원 과소배부","190만 원 과대배부","차이 없음"],"correct":0,"explanation":"실제보다 배부액이 10만 원 많으므로 과대배부야."},{"id":"16-08","lesson":16,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 과소배부액 10만 원 전액을 매출원가에 조정한다. 조정 결과는?","choices":["매출원가 10만 원 증가","매출원가 10만 원 감소","매출액 10만 원 증가","현금 10만 원 증가"],"correct":0,"explanation":"부족하게 배부한 원가를 매출원가에 추가해. 이익은 그만큼 감소해 "choices":["주문별 맞춤 가구 제작","동일 규격 음료 대량 연속 생산","같은 시멘트 연속 생산","동일 정유 공정"],"correct":0,"explanation":"개별 작업과 주문을 구분할 수 있을 때 작업별 원가계산이 적합해."},{"id":"18-02","lesson":18,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"개별원가계산에서 원가를 모으는 기본 단위는?","choices":["작업 또는 주문","주주 개인","은행 계좌만","판매 지역만"],"correct":0,"explanation":"작업원가표 등을 통해 주문별로 제조원가를 집계해."},{"id":"18-03","lesson":18,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"기말 현재 미완성 주문의 원가는?","choices":["재공품","매출원가","광고비","매출액"],"correct":0,"explanation":"제조가 끝나지 않았으므로 재공품 재고로 남아."},{"id":"18-04","lesson":18,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 작업 A 직접재료 50, 직접노무 30, 배부 간접원가 20이다. 작업 총원가는? 단위는 만 원.","choices":["100","80","70","50"],"correct":0,"explanation":"50 + 30 + 20 = 100."},{"id":"18-05","lesson":18,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 작업 총원가 120만 원, 생산수량 60개다. 단위원가는?","choices":["2만 원","20만 원","0.5만 원","72만 원"],"correct":0,"explanation":"120 ÷ 60 = 개당 2만 원."},{"id":"18-06","lesson":18,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 작업 A 직접노무원가 40만 원, 간접원가 예정배부율은 직접노무원가의 150%다. 간접원가 배부액은?","choices":["60만 원","40만 원","100만 원","15만 원"],"correct":0,"explanation":"40 × 150% = 60만 원."},{"id":"18-07","lesson":18,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 미완성 작업 A 원가 30, 미완성 B 원가 50, 완성 C 원가 80이다. 기말재공품은? 단위는 만 원.","choices":["80","160","30","50"],"correct":0,"explanation":"아직 끝나지 않은 작업 A 30 + B 50 = 80. 완성 C는 제품으로 이동해."},{"id":"18-08","lesson":18,"subject":"원가회계","level":"응용","kind":"자체 제작","prompt":"새 상황: 작업 총원가 200만 원, 수량 100개, 그중 70개 판매했다. 단위원가가 같다면 매출원가는?","choices":["140만 원","200만 원","60만 원","70만 원"],"correct":0,"explanation":"단위원가 200/100 = 2만 원. 판매 70 × 2 = 140만 원."},{"id":"19-01","lesson":19,"subject":"원가회계","level":"기초","kind":"자체 제작","prompt":"종합원가계산에 적합한 생산은?","choices":["동일 규격 제품의 연속 대량 생산","단 한 채의 맞춤 주택","주문별 설계 선박만","개인별 맞춤 조각품만"],"correct":0,"explanation":"동종 제품을 공정에서 연속 생산할 때 공정별 평균 원가계산이 적합해."},{"id":"19-02","lesson .correct?'':'wrong-feedback'}" aria-live="polite"><strong>${selected===q.correct?'맞았어. 이렇게 기억해봐.':'정답은 ‘'+esc(q.choices[q.correct])+'’이야.'}</strong><p>${esc(q.explanation)}</p><div class="row" style="margin-top:13px"><button class="explain-link" data-go="lesson/${q.lesson}">이 개념 다시 읽기 ↗</button><button class="explain-link" data-copy-question="${q.id}">질문할 내용 복사</button></div></div>`:''}<div class="quiz-actions"><button class="btn secondary" data-quiz-prev ${s.index===0?'disabled':''}>← 이전</button><div class="row">${s.mode!=='exam'&&!checked?`<button class="btn" id="check-answer" ${selected===undefined?'disabled':''}>정답 확인</button>`:''}${s.mode==='exam'||checked?`<button class="btn" data-quiz-next>${s.index===s.ids.length-1?'채점하고 결과 보기':'다음 문제 →'}</button>`:''}</div></div>${s.mode==='exam'?`<div class="quiz-map" aria-label="시험 문항 이동">${s.ids.map((id,i)=>`<button class="${s.answers[id]!==undefined?'answered':''} ${i===s.index?'current':''}" data-jump="${i}" aria-label="${i+1}번 ${s.answers[id]!==undefined?'답 선택됨':'미응답'}">${i+1}</button>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:14px">답을 고른 뒤 자유롭게 이동할 수 있어. 제한시간이 끝나면 자동 채점돼.</p>`:'<p class="muted" style="font-size:11px;margin-top:17px">답을 고르고 정답을 확인하면 다음 문제로 넘어갈 수 있어.</p>'}</section><aside class="panel quiz-aside"><span class="eyebrow muted">${s.mode==='exam'?'TIME LEFT':'STUDY NOTE'}</span>${s.mode==='exam'?'<div class="timer num" id="timer-desktop" style="margin:15px 0"></div>':'<h3 style="margin:15px 0">한 문제씩,<br>내 속도로.</h3>'}<p class="muted" style="font-size:12px;line-height:1.9">${s.mode==='exam'?'재무회계 20문제<br>원가회계 20문제<br>과목별 40점 이상<br>전체 평균 60점 이상':'틀렸어도 해설을 읽어봐.<br>다음에 맞히면 오답노트에서<br>자동으로 빠져.'}</p><div style="border-top:1px solid var(--line);margin:18px 0"></div><small class="muted">선택한 답 ${Object.keys(s.answers).length} / ${s.ids.length}</small><button class="linkbtn" data-go="home" style="display:block;margin-top:18px">저장하고 공부방으로</button></aside></div>`;
 if(s.mode==='exam')tick();}
function checkAnswer(){const s=state.session;if(!s||s.mode==='exam')return;const q=getQ(s.ids[s.index]);if(s.answers[q.id]===undefined||s.checked[q.id])return;s.checked[q.id]=true;recordQuestion(q,s.answers[q.id]);persist();quiz();}
function finishSession(auto=false){const s=state.session;if(!s||s.finished)return;const unanswered=s.ids.filter(id=>s.answers[id]===undefined).length;const finish=()=>{if(s.mode==='exam')s.ids.forEach(id=>recordQuestion(getQ(id),s.answers[id]));s.finished=true;const result=calculate(s);if(!s.recorded){state.history.push({at:new Date().toISOString(),mode:s.mode,total:s.ids.length,score:result.score,financial:result.financial,cost:result.cost});state.history=state.history.slice(-100);s.recorded=true;}persist();go('result');if(auto)toast('제한시간이 끝나서 자동 채점했어.');};if(!auto&&s.mode==='exam')ask('시험을 제출할까?',unanswered?`아직 ${unanswered}문제가 미응답이야. 미응답은 오답으로 처리하고 채점해.`:'선택한 답으로 최종 채점할게.',finish);else finish();}
function calculate(s){const count=sub=>s.ids.filter(id=>!sub||getQ(id).subject===sub),right=ids=>ids.filter(id=>s.answers[id]===getQ(id).correct).length;const f=count('재무회계'),c=count('원가회계'),fscore=f.length?right(f)/f.length*100:0,cscore=c.length?right(c)/c.length*100:0;return{correct:right(s.ids),score:right(s.ids)/s.ids.length*100,financial:fscore,cost:cscore,ftotal:f.length,ctotal:c.length,pass:s.mode==='exam'&&fscore>=40&&cscore>=40&&(fscore+cscore)/2>=60};}
function result(){const s=state.session;if(!s){go('home');return;}if(!s.finished){go('quiz');return;}const r=calculate(s),wrong=s.ids.filter(id=>s.answers[id]!==getQ(id).correct);app.innerHTML=title('ONE MORE STEP','오늘도 한 걸음 쌓았어.',s.mode==='exam'?'자체 제작 문제로 연습한 결과야. 실제 합격을 보장하는 지표는 아니야.':'점수보다, 해설을 읽고 이해한 개념을 챙겨가자.')+`<section class="panel" style="max-width:850px"><span class="tag ${r.pass?'mint':'pink'}">${s.mode==='exam'?(r.pass?'모의시험 합격 기준 충족':'모의시험 합격 기준 미충족'):'연습 완료'}</span><div class="result-score">${Number(r.score.toFixed(1))}<span>점 / 100</span></div><p class="muted">전체 ${s.ids.length}문제 중 ${r.correct}문제 정답</p><div class="result-columns"><div class="result-sub"><small class="muted">재무회계 · ${r.ftotal}문제</small><strong>${r.ftotal?Number(r.financial.toFixed(1))+'점':'출제 없음'}</strong></div><div class="result-sub"><small class="muted">원가회계 · ${r.ctotal}문제</small><strong>${r.ctotal?Number(r.cost.toFixed(1))+'점':'출제 없음'}</strong></div></div>${s.mode==='exam'?'<p class="muted" style="font-size:12px">과목별 40점 이상이면서 전체 평균 60점 이상이면 기준 충족.</p>':''}<div class="row" style="margin-top:23px">${wrong.length?'<button class="btn" id="retry-wrong">이번 오답만 다시 풀기</button>':''}<button class="btn secondary" data-go="home">공부방으로</button><button class="btn secondary" data-go="sources">실제 기출 보기 ↗</button></div></section><div class="section-header"><h2>문제와 해설 다시 보기</h2></div><div class="panel" style="max-width:850px">${s.ids.map((id,i)=>{const q=getQ(id);return `<details class="review-item"><summary style="cursor:pointer;font-size:13px">${i+1}. ${s.answers[id]===q.correct?'✓ 정답':'다시 보기'} · ${esc(q.prompt)}</summary><p>내 답: ${esc(s.answers[id]===undefined?'미응답':q.choices[s.answers[id]])}<br>정답: ${esc(q.choices[q.correct])}</p><div class="explanation">${esc(q.explanation)}</div><button class="linkbtn" data-go="lesson/${q.lesson}">개념 다시 읽기 ↗</button></details>`;}).join('')}</div>`;if(wrong.length)$('#retry-wrong').onclick=()=>startSession('review',shuffle(wrong));}
function exam(){app.innerHTML=title('MOCK EXAM','실전처럼, 한 번 풀어볼까?','재무회계 20문제 + 원가회계 20문제. 60분 동안 답을 고르고 마지막에 채점해.')+`<div class="source-grid"><section class="panel"><div class="row between"><span class="eyebrow muted">LEVEL 02 / WRITTEN</span><span class="tag pink">유형 모의시험</span></div><h2 style="margin-top:17px">40문제 · 60분</h2><table class="info-table"><tr><th>문제 구성</th><td>재무회계 20 + 원가회계 20</td></tr><tr><th>선정 방식</th><td>과목별 20문제 무작위 추출</td></tr><tr><th>합격 기준</th><td>과목별 40점 이상 + 평균 60점 이상</td></tr><tr><th>채점 방식</th><td>과목당 1문제 5점, 미응답은 오답</td></tr></table><button class="btn" id="start-exam">모의시험 시작 ↗</button>${state.session?.mode==='exam'&&!state.session.finished?'<button class="btn secondary" data-go="quiz" style="margin-top:12px">풀던 시험 이어서</button>':''}</section><section class="panel"><span class="eyebrow muted">BEFORE YOU START</span><h3 style="margin:17px 0">알아두면 좋은 것</h3><ul style="padding-left:19px;font-size:13px;line-height:2.2;color:var(--sub)"><li>일반 계산기와 메모지를 준비해.</li><li>제출 전에는 답을 바꾸고 문항을 이동할 수 있어.</li><li>페이지를 나가도 타이머는 계속 흘러.</li><li>시간이 끝나면 미응답을 포함해 자동 채점해.</li><li>실제 CBT 프로그램과는 화면이 달라.</li></ul><div class="notice">이 모의시험은 자체 제작 160문제에서 추출해. 실제 기출·최신 복원문제는 자료실에서 별도로 확인해.</div><button class="linkbtn" data-go="sources">기출·복원자료 확인 ↗</button></section></div><div class="section-header"><h2>최근 시험 기록</h2></div><div class="panel">${state.history.filter(h=>h.mode==='exam').slice(-5).reverse().map(h=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)"><span class="muted" style="font-size:12px">${esc(new Date(h.at).toLocaleDateString('ko-KR'))}</span><strong>${Number(h.score.toFixed(1))}점</strong><span style="font-size:12px">재무 ${Number(h.financial.toFixed(1))} / 원가 ${Number(h.cost.toFixed(1))}</span></div>`).join('')||'<p class="muted" style="font-size:13px">아직 시험 기록이 없어. 준비되면 시작해 봐.</p>'}</div>`;$('#start-exam').onclick=()=>{const ids=[...shuffle(QUESTIONS.filter(q=>q.subject==='재무회계')).slice(0,20),...shuffle(QUESTIONS.filter(q function review(){const list=QUESTIONS.filter(q=>reviewFilter==='saved'?state.bookmarks.includes(q.id):state.attempts[q.id]&&!state.attempts[q.id].correct);app.innerHTML=title('REVIEW & REMEMBER','다시 보면, 내 것이 돼.','마지막 풀이에서 틀린 문제를 모았어. 다시 맞히면 오답 목록에서 빠져.')+`<div class="filterbar"><button class="chip ${reviewFilter==='wrong'?'active':''}" data-review="wrong">오답 문제</button><button class="chip ${reviewFilter==='saved'?'active':''}" data-review="saved">별표한 문제</button><span class="muted" style="font-size:12px;margin-left:auto">${list.length}문제</span></div>${list.length?`<div class="row" style="margin-bottom:20px"><button class="btn" id="start-review">${reviewFilter==='wrong'?'오답':'저장한 문제'} 다시 풀기 ↗</button></div><div class="panel">${list.map(q=>`<article class="review-item"><div class="row between"><span class="tag ${q.subject==='원가회계'?'mint':'pink'}">${q.subject} · ${esc(LESSONS[q.lesson-1].title)}</span><button class="bookmark ${state.bookmarks.includes(q.id)?'on':''}" data-review-bookmark="${q.id}" aria-label="문제 별표 전환">${icon('star')}</button></div><p>${esc(q.prompt)}</p><details><summary style="font-size:12px;cursor:pointer;color:#87506a">정답과 해설 펼치기</summary><div class="explanation" style="margin-top:12px"><strong>정답: ${esc(q.choices[q.correct])}</strong><br>${esc(q.explanation)}</div></details><button class="linkbtn" data-go="lesson/${q.lesson}">연결 개념 다시 읽기 ↗</button></article>`).join('')}</div>`:`<div class="empty"><h3>${reviewFilter==='wrong'?'아직 다시 볼 오답이 없어.':'별표한 문제가 없어.'}</h3><p>${reviewFilter==='wrong'?'문제를 풀면 오답을 여기에 모아줄게.':'문제를 풀 때 별 버튼을 눌러 저장해 봐.'}</p><button class="btn secondary" data-go="practice">문제 풀러 가기</button></div>`}`;if(list.length)$('#start-review').onclick=()=>requestStart(reviewFilter==='wrong'?'review':'bookmarks',shuffle(list).map(q=>q.id));}

];
function sources(){const list=SOURCES.filter(s=>sourceFilter==='all'||sourceFilter===s.type);app.innerHTML=title('SOURCES & PAST PAPERS','기출은 출처까지, 확실하게.','공식 공개자료, 과거 기출, 출판사 복원자료를 구분해서 모았어.')+`<div class="notice neutral"><strong>문제 구분을 먼저 확인해.</strong><br>이 사이트 안에서 푸는 160문제는 <strong>자체 제작 연습문제</strong>야. 실제 기출·복원문제는 아래 원문으로 연결돼. 상시시험 원문은 비공개이며, 출처 확인이 안 된 내용을 실제 복원문제로 표시하지 않았어.</div><div class="filterbar">${[['all','전체'],['official','공식·공개형'],['past','지난 기출'],['restore','복원자료']].map(([k,v])=>`<button class="chip ${sourceFilter===k?'active':''}" data-source-filter="${k}">${v}</button>`).join('')}</div><div class="source-grid">${list.map(s=>`<article class="source-card"><span class="tag ${s.type==='official'?'mint':'pink'}" style="align-self:start">${s.tag}</span><h3>${s.title}</h3><p>${s.desc}</p><a class="btn secondary small" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${s.button} ↗</a></article>`).join('')}</div><div class="section-header"><h2>시험 기본 정보</h2></div><div class="panel"><table class="info-table"><tr><th>필기</th><td>재무회계·원가회계 / 객관식 40문항 / 60분</td></tr><tr><th>필기 합격</th><td>각 과목 40점 이상, 전 과목 평균 60점 이상</td></tr><tr><th>실기</th><td>회계시스템의 운용 / 컴퓨터 작업형 / 80분</td></tr><tr><th>실기 합격</th><td>100점 만점에 70점 이상</td></tr></table><p class="muted" style="font-size:11px">확인 기준: 2026. 11. 15. · 출처: 대한상공회의소 자격평가사업단. 변경 시 공식 공지를 우선 확인해.</p></div>`;}
const GLOSSARY=[['분개','하나의 거래를 차변과 대변으로 나눠 적는 것.'],['차변·대변','장부의 왼쪽과 오른쪽. 좋고 나쁨을 뜻하지 않아.'],['자산','과거 사건으로 기업이 통제하는 현재의 경제적 자원. 현금·기계·받을 돈 등을 생각해.'],['부채','과거 사건으로 생긴, 자원을 이전해야 할 현재의무.'],['자본','자산에서 모든 부채를 뺀 나머지 몫.'],['수익·비용','기간의 성과를 늘리는 항목과 줄이는 항목. 현금 수입·지출 시점과 다를 수 있어.'],['감가상각','기계 같은 자산의 상각대상금액을 사용기간에 나눠 비용으로 처리하는 것.'],['매출채권·매입채무','팔고 받을 돈·사고 지급할 돈.'],['선급·선수','미리 지급한 것·미리 받은 것. 아직 사용·이행하지 않은 부분을 구분해.'],['원가','제품이나 서비스를 얻기 위해 사용한 자원의 가치.'],['재공품','제조가 아직 끝나지 않은 제품.'],['배부','여러 제품에 공통으로 든 원가를 일정한 기준으로 나누는 것.'],['완성품환산량','덜 완성된 제품을 완성품 몇 개 분량의 작업인지로 바꾼 수량.'],['분리점','공통 공정에서 생산된 제품들을 개별 제품으로 식별할 수 있게 되는 시점.']];
function settings(){app.innerHTML=title('MY LITTLE SETTINGS','내 속도에 맞춰서.','학습 기록은 지금 쓰는 브라우저에 저장돼. 다른 기기로 옮길 때는 백업을 이용해.')+`<section class="panel"><div class="settings-group"><h3>글씨 크기</h3><p>개념 설명과 문제의 글씨를 조금 더 크게 볼 수 있어.</p><button class="btn secondary" id="toggle-large" aria-pressed="${state.settings.large}">${state.settings.large?'기본 글씨로 바꾸기':'큰 글씨로 보기'}</button></div><div class="settings-group"><h3>기록 백업</h3><p>완료한 개념, 메모, 오답, 별표, 시험 기록을 JSON 파일로 내려받아. 다른 기기에서도 이 파일을 불러오면 이어갈 수 있어. 자동 기기 동기화는 지원하지 않아.</p><div class="row"><button class="btn" id="export-backup">기록 내보내기</button><button class="btn secondary" id="import-backup">백업 불러오기</button></div></div><div class="settings-group"><h3>저장된 기록</h3><p>현재 브라우저의 학습 기록을 처음 상태로 되돌릴 수 있어. 초기화 전에 백업해 두면 복원할 수 있어.</p><button class="btn danger small" id="reset-state">학습 기록 초기화</button></div></section><div class="section-header"><h2>작은 회계 사전</h2></div><div class="glossary">${GLOSSARY.map(([k,v])=>`<div><strong>${k}</strong><p>${v}</p></div>`).join('')}</div>`;$('#toggle-large').onclick=()=>{state.settings.large=!state.settings.large;persist();document.body.classList.toggle('large-text',state.settings.large);settings();};$('#export-backup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`chageun-records-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('학습 기록을 파일로 내보냈어.');};$('#import-backup').onclick=()=>$('#backup-file').click();$('#reset-state').onclick=()=>ask('학습 기록을 초기화할까?','이 브라우저의 개념 진도·메모·문제 기록·진행 중 시험이 모두 초기화돼. 저장해 둔 백업 파일로 복원할 수 있어.',()=>{state=fresh();persist();document.body.classList.remove('large-text');settings();toast('학습 기록을 초기화했어.');});}
$('#backup-file').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>2000000){toast('파일이 너무 커. 이 공부방의 백업 파일을 골라줘.');return;}try{const imported=normalize(JSON.parse(await f.text()));ask('백업 기록으로 바꿀까?','현재 브라우저의 기록이 선택한 백업 파일의 기록으로 교체돼.',()=>{state=imported;persist();document.body.classList.toggle('large-text',state.settings.large);render();toast('백업 기록을 불러왔어.');});}catch(e){toast('백업 형식을 확인할 수 없어. 내보낸 JSON 파일을 골라줘.');}});
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-go]');if(!t)return;if(t.hasAttribute('data-go')){go(t.dataset.go);return;}if(t.hasAttribute('data-learn-filter')){learnFilter=t.dataset.learnFilter;learn();return;}if(t.hasAttribute('data-complete')){const id=Number(t.dataset.complete);state.completed=state.completed.includes(id)?state.completed.filter(n=>n!==id):[...state.completed,id];persist();t.textContent=state.completed.includes(id)?'✓ 이해한 개념':'이 개념 이해했어';toast(state.completed.includes(id)?'개념 하나, 내 것이 됐어.':'완료 표시를 해제했어.');return;}if(t.hasAttribute('data-cafe')){cafeStage=t.dataset.cafe==='reset'?0:Math.min(2,cafeStage+1);paintCafe();return;}if(t.hasAttribute('data-lesson-practice')){requestStart('lesson',QUESTIONS.filter(q=>q.lesson===Number(t.dataset.lessonPractice)).map(q=>q.id));return;}if(t.hasAttribute('data-source-filter')){sourceFilter=t.dataset.sourceFilter;sources();return;}if(t.hasAttribute('data-review')){reviewFilter=t.dataset.review;review();return;}if(t.hasAttribute('data-review-bookmark')){toggleBookmark(t.dataset.reviewBookmark);review();return;}if(t.hasAttribute('data-bookmark')){toggleBookmark(t.dataset.bookmark);quiz();return;}if(t.hasAttribute('data-answer')){const s=state.session;if(!s||s.finished)return;const id=s.ids[s.index];if(s.checked[id])return;s.answers[id]=Number(t.dataset.answer);persist();quiz();return;}if(t.id==='check-answer'){checkAnswer();return;}if(t.hasAttribute('data-quiz-prev')){state.session.index--;persist();quiz();return;}if(t.hasAttribute('data-quiz-next')){const s=state.session;if(s.index===s.ids.length-1)finishSession();else{s.index++;persist();quiz();window.scrollTo({top:0,behavior:'instant'});}return;}if(t.hasAttribute('data-jump')){state.session.index=Number(t.dataset.jump);persist();quiz();return;}if(t.hasAttribute('data-copy-question')){const q=getQ(t.dataset.copyQuestion),text=`전산회계운용사 2급 기초를 배우는 중이야. 아래 문제를 쉬운 말과 새로운 예시로 다시 설명해줘.\n문제: ${q.prompt}\n정답: ${q.choices[q.correct]}\n해설: ${q.explanation}`;try{await navigator.clipboard.writeText(text);toast('복사했어. 채팅에 붙여 넣으면 돼.');}catch(e){toast('복사가 제한됐어. 문제와 해설을 선택해서 복사해 줘.');}}});
function toggleBookmark(id){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];persist();}
function tick(){const s=state.session;if(!s||s.mode!=='exam'||s.finished)return;const remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));const time=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');for(const el of document.querySelectorAll('#timer-mobile,#timer-desktop')){el.textContent=time;el.classList.toggle('urgent',remaining<=300);}if(remaining===0){$('#confirm-dialog').close();finishSession(true);}}
setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
function render(){const hash=location.hash.slice(1)||'home';const parts=hash.split('/');view=parts[0];if(!['home','learn','lesson','practice','exam','quiz','result','review','sources','settings'].includes(view)){go('home');return;}document.body.classList.toggle('large-text',state.settings.large);nav();if(view==='home')home();if(view==='learn')learn();if(view==='lesson')lessonView(Number(parts[1]));if(view==='practice')practice();if(view==='exam')exam();if(view==='quiz')quiz();if(view==='result')result();if(view==='review')review();if(view==='sources')sources();if(view==='settings')settings();document.title=(view==='lesson'?(LESSONS.find(l=>l.id===Number(parts[1]))?.title||'개념'):pages.find(([id])=>id===view)?.[1]||'나의 공부')+' — 차근회계';}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
$('#date').textContent=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase();render();tick();
</script>
</body>
</html>
