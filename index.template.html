 <a class="brand" href="#home"><span class="brand-mark">c.</span><span class="brand-name">차근회계<small>YOUR LITTLE STUDY ROOM</small></span></a>
 <div class="side-label">MY STUDY ROOM</div><nav class="nav" aria-label="주 메뉴" id="desktop-nav"></nav>
 <div class="sidebar-foot"><span class="smalltag">전산회계운용사 2급</span><p>처음부터, 내 속도로.<br>하나씩 알면 되는 거야.</p><button class="linkbtn" data-go="settings">기록 백업 · 설정</button></div>

<main class="main" id="content" tabindex="-1">
 <header class="topbar"><div class="breadcrumbs">나의 공부방 <span id="crumb">/ 오늘의 공부</span></div><a class="brand mobile-brand" href="#home"><span class="brand-mark">c.</span><span class="brand-name">차근회계<small>YOUR LITTLE STUDY ROOM</small></span></a><div class="top-right"><span class="date" id="date"></span><span class="pill"><i class="dot"></i> 2급 준비 중</span><span class="avatar">차</span></div></header>
 <div id="app" class="page"></div>
 <footer class="footer"><span class="serif">One page at a time.</span><span>직접 만든 개념·유형 연습 160문제 · 기출은 출처에서 확인 · <button class="linkbtn" data-go="settings">내 기록 관리</button></span></footer>

<dialog id="confirm-dialog" class="dialog" aria-labelledby="dialog-title"><h3 id="dialog-title"></h3><p id="dialog-body"></p><div class="row" style="justify-content:flex-end"><button id="dialog-cancel" class="btn secondary">취소</button><button id="dialog-ok" class="btn">확인</button></div></dialog>
<input type="file" id="backup-file" accept="application/json,.json" class="hidden" aria-label="백업 파일 선택">
<script>
'use strict';
const CONTENT = /*CONTENT_JSON*/;
const LESSONS=CONTENT.lessons, QUESTIONS=CONTENT.questions;
const KEY='chageun-accounting-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={home:'<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1Z"/>',learn:'<path d="M12 5c-4-3-9-1-9-1v15s5-2 9 1c4-3 9-1 9-1V4s-5-2-9 1Zm0 0v15"/>',practice:'<rect x="4" y="3" width="16" height="19" rx="2"/><path d="M8 8h8M8 12h5M8 16h7"/>',exam:'<circle cx="12" cy="13" r="8"/><path d="M12 9v5l3 2M9 2h6M12 2v3"/>',review:'<path d="m6 3 12 0a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/>',sources:'<path d="M14 3h7v7M21 3l-9 9M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>'};
const icon=k=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${icons[k]||icons.learn}</svg>`;
const pages=[['home','오늘의 공부'],['learn','기초 개념'],['practice','문제 풀기'],['exam','모의시험'],['review','오답노트'],['sources','기출·복원자료']];
const fresh=()=>({version:1,completed:[],notes:{},attempts:{},bookmarks:[],history:[],lastLesson:1,settings:{large:false},session:null});
let state=fresh(), storageOK=true;
function normalize(v){
 if(!v||v.version!==1)throw Error('이 공부방의 백업 파일이 아니야.');
 const out=fresh(), ids=new Set(QUESTIONS.map(q=>q.id));
 out.completed=Array.isArray(v.completed)?[...new Set(v.completed.filter(n=>Number.isInteger(n)&&LESSONS.some(l=>l.id===n)))]:[];
 out.bookmarks=Array.isArray(v.bookmarks)?[...new Set(v.bookmarks.filter(id=>ids.has(id)))]:[];
 if(v.notes&&typeof v.notes==='object')for(const l of LESSONS)if(typeof v.notes[l.id]==='string')out.notes[l.id]=v.notes[l.id].slice(0,10000);
 if(v.attempts&&typeof v.attempts==='object')for(const q of QUESTIONS){const a=v.attempts[q.id];if(a&&typeof a==='object'&&Number.isInteger(a.times)&&a.times>0&&typeof a.correct==='boolean')out.attempts[q.id]={times:Math.min(a.times,100000),correct:a.correct,at:typeof a.at==='string'?a.at:'',answer:typeof a.answer==='string'?a.answer.slice(0,2000):'',correctCount:Number.isInteger(a.correctCount)?Math.max(0,Math.min(a.correctCount,a.times)):Number(a.correct)};}
 out.history=Array.isArray(v.history)?v.history.filter(h=>h&&typeof h==='object'&&Number.isFinite(h.score)&&h.score>=0&&h.score<=100&&['exam','practice','review','bookmarks','lesson'].includes(h.mode)&&typeof h.at==='string').slice(-100).map(h=>({score:h.score,mode:h.mode,at:h.at,total:Number.isInteger(h.total)?h.total:0,financial:Number.isFinite(h.financial)?h.financial:0,cost:Number.isFinite(h.cost)?h.cost:0})):[];
 out.lastLesson=LESSONS.some(l=>l.id===v.lastLesson)?v.lastLesson:1;out.settings={large:!!v.settings?.large};
 const s=v.session;
 if(s&&typeof s==='object'&&['exam','practice','review','bookmarks','lesson'].includes(s.mode)&&Array.isArray(s.ids)&&s.ids.length>0&&s.ids.length<=QUESTIONS.length&&s.ids.every(id=>ids.has(id))&&new Set(s.ids).size===s.ids.length){
  const validOrder=s.ids.every(id=>Array.isArray(s.orders?.[id])&&s.orders[id].length===4&&new Set(s.orders[id]).size===4&&s.orders[id].every(n=>Number.isInteger(n)&&n>=0&&n<4));
  if(validOrder){const answers={},checked={};for(const id of s.ids){if(Number.isInteger(s.answers?.[id])&&s.answers[id]>=0&&s.answers[id]<4)answers[id]=s.answers[id];if(s.checked?.[id]===true)checked[id]=true;}
   out.session={mode:s.mode,ids:s.ids,orders:s.orders,index:Number.isInteger(s.index)?Math.max(0,Math.min(s.index,s.ids.length-1)):0,answers,checked,deadline:s.mode==='exam'&&Number.isFinite(s.deadline)?s.deadline:null,started:typeof s.started==='string'?s.started:new Date().toISOString(),finished:!!s.finished,recorded:!!s.recorded};
   if(s.mode==='exam'&&!Number.isFinite(s.deadline))out.session=null;
  }
 }
 return out;
}
try{const raw=localStorage.getItem(KEY);if(raw)state=normalize(JSON.parse(raw));}catch(e){storageOK=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){if(storageOK)toast('이 브라우저에서는 저장이 어려워. 기록을 백업해 줘.');storageOK=false;}}
let view='home',learnFilter='전체',learnSearch='',reviewFilter='wrong',sourceFilter='all',cafeStage=0;
const app=$('#app');
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.add('hidden'),3200);}
function ask(title,body,onOK){$('#dialog-title').textContent=title;$('#dialog-body').textContent=body;$('#confirm-dialog').showModal();$('#dialog-cancel').onclick=()=>$('#confirm-dialog').close();$('#dialog-ok').onclick=()=>{$('#confirm-dialog').close();onOK();};}
function go(p){if(location.hash==='#'+p)render();else location.hash=p;}
function nav(){const active=view==='lesson'?'learn':view==='quiz'||view==='result'?(state.session?.mode==='exam'?'exam':'practice'):view;$('#desktop-nav').innerHTML=pages.map(([id,label])=>`<button data-go="${id}" class="${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${icon(id)}${label}</button>`).join('');$('#mobile-nav').innerHTML=pages.filter(([id])=>id!=='exam').map(([id,label])=>`<button data-go="${id}" class="${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${icon(id)}<span>${id==='sources'?'기출자료':id==='home'?'공부방':label}</span></button>`).join('');$('#crumb').textContent='/ '+(pages.find(([id])=>id===active)?.[1]||'기록과 설정');}
function title(en,h,p){return `<div class="titleblock"><div class="eyebrow">${en}</div><h1>${h}</h1><p>${p}</p></div>`;}
function getQ(id){return QUESTIONS.find(q=>q.id===id);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function percentage(n,d){return d?Math.round(n/d*100):0;}
function stats(){const a=Object.values(state.attempts),total=a.reduce((n,v)=>n+v.times,0),correct=a.reduce((n,v)=>n+(v.correctCount||0),0);return{studied:a.length,total,rate:percentage(correct,total),wrong:a.filter(a=>!a.correct).length};}
function home(){const st=stats(),next=LESSONS.find(l=>!state.completed.includes(l.id))||LESSONS[0];
 app.innerHTML=`<div class="hero"><section class="hero-main"><div class="eyebrow">ACCOUNTING, AT YOUR OWN PACE</div><h1>회계랑,<br>조금 더 가까이.</h1><p>어려운 말은 쉽게, 낯선 문제는 차근차근.<br>오늘도 한 개념만 알아가면 충분해.</p><button class="btn" data-go="lesson/${next.id}">${state.completed.length?'이어서 공부하기':'첫 개념부터 시작하기'} <span aria-hidden="true">↗</span></button><div class="hero-decor" aria-hidden="true"><div class="page-sheet"></div><div class="page-sheet"><div class="sheet-plus">+</div><div class="sheet-line"></div><div class="sheet-line"></div><div class="sheet-line"></div></div></div></section><section class="hero-note"><div class="eyebrow">A LITTLE REMINDER / 01</div><div class="note-rule"></div><div class="equation"><div><strong>자산</strong><small>가진 것</small></div><b>=</b><div><strong>부채</strong><small>갚을 것</small></div><b>+</b><div><strong>자본</strong><small>내 몫</small></div></div><p>빌린 돈도 통장에 있다면 자산이야.<br>대신 갚아야 할 부채도 함께 생겨.</p><button class="linkbtn" data-go="lesson/1">카페 예시로 이해하기 ↗</button></section></div>
 <div class="stats"><div class="stat"><small>개념 진도</small><strong class="num">${state.completed.length}<span>/ 20 단원</span></strong><div class="progress"><i style="width:${state.completed.length*5}%"></i></div></div><div class="stat"><small>풀어 본 문제</small><strong class="num">${st.studied}<span>/ 160 문제</span></strong><div class="progress"><i style="width:${percentage(st.studied,160)}%"></i></div></div><div class="stat"><small>누적 정답률</small><strong class="num">${st.rate}<span>% · ${st.total}회 풀이</span></strong></div><div class="stat"><small>다시 볼 오답</small><strong class="num">${st.wrong}<span>문제</span></strong></div></div>
 <div class="home-bottom"><section><div class="section-header"><div><span class="eyebrow">START SMALL</span><h2>오늘의 작은 공부</h2><p>개념을 읽고, 연결된 문제를 풀어봐.</p></div><button class="linkbtn" data-go="learn">전체 단원 ↗</button></div><div class="panel">${LESSONS.slice(0,3).map(l=>`<button class="lesson-mini" data-go="lesson/${l.id}"><span class="lesson-index">0${l.id}</span><span><strong>${l.title}</strong><small>${l.subject} · 개념 + 연습 8문제</small></span><span class="arrow">${state.completed.includes(l.id)?'✓':'↗'}</span></button>`).join('')}</div></section><section><div class="section-header"><div><span class="eyebrow">LITTLE STEPS</span><h2>쌓이고 있는 나의 기록</h2><p>초록색 한 칸이, 이해한 개념 하나.</p></div></div><div class="panel"><div class="row between"><span class="tag mint">20개 개념 지도</span><small class="muted">${state.completed.length*5}% 완료</small></div><div class="study-map">${LESSONS.map(l=>`<span class="${state.completed.includes(l.id)?'done':''}" title="${esc(l.title)}">${String(l.id).padStart(2,'0')}</span>`).join('')}</div><p class="quote">틀린 문제도 괜찮아.<br>다음에 알아보면 되는 거야.</p><div class="row" style="margin-top:20px"><button class="btn secondary small" data-go="review">오답 복습</button><button class="btn secondary small" data-go="exam">40문제 모의시험</button></div></div></section></div>
 ${state.session&&!state.session.finished?`<div class="notice neutral row between"><span>풀던 ${state.session.mode==='exam'?'모의시험':'문제'}이 남아 있어. ${state.session.index+1}/${state.session.ids.length}번</span><button class="btn small" data-go="quiz">이어서 풀기</button></div>`:''}
 ${!storageOK?'<div class="notice">현재 브라우저에서 자동 저장이 제한됐어. 설정에서 기록을 파일로 백업할 수 있어.</div>':''}`;
}
function learn(){app.innerHTML=title('BASIC CONCEPTS','처음부터, 차근차근.','한 단원씩 읽고 익혀 봐. 이해한 단원에는 완료 표시를 남겨줘.')+`<div class="filterbar"><input id="learn-search" class="search" aria-label="개념 검색" placeholder="개념이나 키워드 찾기" value="${esc(learnSearch)}">${['전체','재무회계','원가회계'].map(s=>`<button class="chip ${learnFilter===s?'active':''}" data-learn-filter="${s}">${s}</button>`).join('')}</div><div id="lesson-grid" class="lessons-grid"></div>`;paintLessons();$('#learn-search').addEventListener('input',e=>{learnSearch=e.target.value;paintLessons();});}
function paintLessons(){const list=LESSONS.filter(l=>(learnFilter==='전체'||l.subject===learnFilter)&&`${l.title} ${l.intro} ${l.rules.join(' ')}`.includes(learnSearch));$('#lesson-grid').innerHTML=list.length?list.map(l=>`<button class="lesson-card" data-go="lesson/${l.id}"><div class="top"><span class="serif">${String(l.id).padStart(2,'0')}</span><span class="tag ${l.subject==='원가회계'?'mint':'pink'}">${l.subject}</span></div><h3>${esc(l.title)}</h3><p>${esc(l.intro)}</p><div class="card-foot"><span>${state.completed.includes(l.id)?'✓ 개념 학습 완료':'개념 + 연습 8문제'}</span><span>↗</span></div></button>`).join(''):'<div class="empty" style="grid-column:1/-1"><h3>찾는 개념이 없어.</h3><p>검색어를 조금 짧게 바꿔봐.</p></div>';}
function lessonView(id){const l=LESSONS.find(l=>l.id===id);if(!l){go('learn');return;}state.lastLesson=id;persist();app.innerHTML=`<div class="reading"><button class="linkbtn" data-go="learn">← 전체 개념</button><article class="panel" style="margin-top:15px"><div class="row between"><span class="eyebrow muted">CHAPTER ${String(id).padStart(2,'0')} / 20</span><span class="tag ${l.subject==='원가회계'?'mint':'pink'}">${l.subject}</span></div><h1>${esc(l.title)}</h1><p class="intro">${esc(l.intro)}</p><ul class="rule-list">${l.rules.map((r,i)=>`<li><span>0${i+1}</span>${esc(r)}</li>`).join('')}</ul><div class="example"><div class="eyebrow">A FRESH EXAMPLE · 새 상황</div>${esc(l.example)}</div><div class="trap"><strong>여기서 잠깐.</strong><br>${esc(l.trap)}</div>${id===1?'<div id="cafe-box"></div>':''}<div style="margin-top:28px"><label for="lesson-note"><strong style="font-size:13px">내 말로 남기는 한 줄</strong></label><textarea id="lesson-note" class="lesson-note" maxlength="10000" placeholder="예: 빌린 돈도 갖고 있으면 자산. 갚을 돈은 부채!">${esc(state.notes[id]||'')}</textarea><small class="muted" id="note-saved">메모는 이 기기에 자동 저장돼.</small></div><div class="reading-actions"><button class="btn secondary" data-complete="${id}">${state.completed.includes(id)?'✓ 이해한 개념':'이 개념 이해했어'}</button><button class="btn" data-lesson-practice="${id}">연결된 8문제 풀기 ↗</button></div></article><div class="row between" style="margin-top:20px">${id>1?`<button class="linkbtn" data-go="lesson/${id-1}">← 이전 개념</button>`:'<span></span>'}${id<20?`<button class="linkbtn" data-go="lesson/${id+1}">다음 개념 →</button>`:'<button class="linkbtn" data-go="exam">모의시험으로 →</button>'}</div></div>`;
 $('#lesson-note').addEventListener('input',e=>{state.notes[id]=e.target.value;persist();$('#note-saved').textContent=storageOK?'저장했어.':'자동 저장이 어려워. 설정에서 백업해 줘.';});if(id===1){cafeStage=0;paintCafe();}}
function paintCafe(){const cash=[500,300,200][cafeStage],machine=[0,200,200][cafeStage],debt=[100,100,0][cafeStage];$('#cafe-box').innerHTML=`<section class="cafe"><div class="row between"><strong style="font-size:14px">작은 카페, 같은 상황 이어 보기</strong><button class="linkbtn" data-cafe="reset">처음으로</button></div><small>${['새 상황: 내 돈 400 + 대출 100으로 시작','이어서 ① 현금 200으로 커피 머신 구입','이어서 ② 현금 100으로 대출 전액 상환'][cafeStage]} (단위: 만 원)</small><div class="cafe-values"><div><small>현금 ${cash} + 기계 ${machine}</small><strong>자산 ${cash+machine}</strong></div><div><small>갚을 돈</small><strong>부채 ${debt}</strong></div><div><small>자산 − 부채</small><strong>자본 400</strong></div></div><p class="cafe-text">${['대출도 지금 통장에 있으니 자산이야. 그만큼 갚을 부채도 있어.','돈이 기계로 바뀌었어. 전체 자산 500은 그대로야.','현금과 부채가 100씩 줄어. 자본 400은 그대로야.'][cafeStage]}</p><div class="row"><button class="btn secondary small" data-cafe="next" ${cafeStage===2?'disabled':''}>${cafeStage===0?'이어서: 기계 사기 →':cafeStage===1?'이어서: 빚 갚기 →':'같은 상황 끝'}</button></div></section>`;}
function practice(){app.innerHTML=title('PRACTICE ROOM','개념을 문제로 익혀봐.','모든 문항에 쉬운 해설이 있어. 답을 고르고 확인하면 풀이가 나와.')+`<section class="panel" style="max-width:840px"><div class="row between"><h3>오늘은 어떤 문제를 풀까?</h3><span class="tag pink">자체 제작 160문제</span></div><div class="formgrid"><label>과목<select id="practice-subject"><option>전체</option><option>재무회계</option><option>원가회계</option></select></label><label>단원<select id="practice-lesson"><option value="all">모든 단원</option>${LESSONS.map(l=>`<option value="${l.id}">${l.id}. ${l.title}</option>`).join('')}</select></label><label>문제 단계<select id="practice-level"><option>전체</option><option>기초</option><option>응용</option></select></label><label>문제 수<select id="practice-count"><option value="10">10문제</option><option value="5">5문제</option><option value="20">20문제</option><option value="all">선택 범위 전체</option></select></label></div><p class="muted" id="available" style="font-size:12px;margin-bottom:18px">선택 범위에 160문제가 있어.</p><button class="btn" id="start-practice">문제 풀기 시작 ↗</button></section><div class="notice" style="max-width:840px">이 안의 문제는 직접 만든 개념·유형 연습문제야. 실제 기출·복원문제는 <button class="linkbtn" data-go="sources">기출·복원자료</button>에서 출처를 확인해.</div><section class="panel" style="max-width:840px;margin-top:20px"><span class="eyebrow muted">JOURNAL ENTRY</span><h3 style="margin:8px 0">분개부터 익히고 싶다면</h3><p class="muted" style="font-size:13px;margin-bottom:16px">차변과 대변을 고르는 8문제부터 시작해봐.</p><button class="btn secondary" data-lesson-practice="2">분개 연습하기</button></section>`;
 function pool(){return QUESTIONS.filter(q=>($('#practice-subject').value==='전체'||q.subject===$('#practice-subject').value)&&($('#practice-lesson').value==='all'||q.lesson===Number($('#practice-lesson').value))&&($('#practice-level').value==='전체'||q.level===$('#practice-level').value));}
 for(const el of app.querySelectorAll('select'))el.onchange=()=>{$('#available').textContent=`선택 범위에 ${pool().length}문제가 있어.`;};$('#start-practice').onclick=()=>{const p=pool();if(!p.length){toast('조건에 맞는 문제가 없어. 과목이나 단원을 바꿔봐.');return;}const n=$('#practice-count').value;requestStart('practice',shuffle(p).slice(0,n==='all'?p.length:Number(n)).map(q=>q.id));};}
function requestStart(mode,ids){const start=()=>startSession(mode,ids);if(state.session&&!state.session.finished)ask('풀던 문제를 마치고 새로 시작할까?','이미 확인한 연습문제 기록은 남아. 진행 중인 모의시험의 미제출 답안은 새 시험으로 바뀌어.',start);else start();}
function startSession(mode,ids){state.session={mode,ids,orders:Object.fromEntries(ids.map(id=>[id,shuffle([0,1,2,3])])),index:0,answers:{},checked:{},deadline:mode==='exam'?Date.now()+60*60*1000:null,started:new Date().toISOString(),finished:false,recorded:false};persist();go('quiz');}
function recordQuestion(q,answer){const prior=state.attempts[q.id]||{times:0,correctCount:0};const correct=answer===q.correct;state.attempts[q.id]={times:prior.times+1,correct,answer:answer===undefined?'미응답':q.choices[answer],at:new Date().toISOString(),correctCount:(prior.correctCount||0)+Number(correct)};}
function quiz(){const s=state.session;if(!s){go('practice');return;}if(s.finished){go('result');return;}if(s.mode==='exam'&&s.deadline<=Date.now()){finishSession(true);return;}const q=getQ(s.ids[s.index]),checked=!!s.checked[q.id],selected=s.answers[q.id],bookmarked=state.bookmarks.includes(q.id);app.innerHTML=`<div class="row between" style="margin-bottom:18px"><button class="linkbtn" data-go="${s.mode==='exam'?'exam':'practice'}">← ${s.mode==='exam'?'시험 안내':'문제 설정'}</button><span class="row"><span class="tag">${s.mode==='exam'?'40문제 모의시험':s.mode==='lesson'?'단원 연습':'유형 연습'}</span>${s.mode==='exam'?'<span id="timer-mobile" class="num" style="font-size:17px" aria-label="남은 시간"></span>':''}</span></div><div class="quiz-layout"><section class="panel quiz-panel"><div class="quiz-head"><span class="row"><span class="eyebrow">QUESTION <b class="num">${String(s.index+1).padStart(2,'0')}</b> / ${s.ids.length}</span><span class="tag ${q.subject==='원가회계'?'mint':'pink'}">${q.subject}</span></span><button class="bookmark ${bookmarked?'on':''}" aria-label="${bookmarked?'저장한 문제에서 빼기':'문제 저장하기'}" aria-pressed="${bookmarked}" data-bookmark="${q.id}">${icon('star')}</button></div><div class="progress"><i style="width:${percentage(s.index+1,s.ids.length)}%"></i></div><p class="muted" style="font-size:11px;margin-top:15px">${esc(LESSONS[q.lesson-1].title)} · ${q.level} · 자체 제작</p><h2 class="quiz-title">${esc(q.prompt)}</h2><div role="group" aria-label="답 선택">${s.orders[q.id].map((original,i)=>`<button class="choice ${selected===original?'selected':''} ${checked&&original===q.correct?'correct':''} ${checked&&selected===original&&selected!==q.correct?'wrong':''}" data-answer="${original}" aria-pressed="${selected===original}" ${checked?'disabled':''}><span class="letter">${i+1}</span><span>${esc(q.choices[original])}</span>${checked&&original===q.correct?'<span style="margin-left:auto" aria-label="정답">✓</span>':''}</button>`).join('')}</div>${checked?`<div class="feedback ${selected===q.correct?'':'wrong-feedback'}" aria-live="polite"><strong>${selected===q.correct?'맞았어. 이렇게 기억해봐.':'정답은 ‘'+esc(q.choices[q.correct])+'’이야.'}</strong><p>${esc(q.explanation)}</p><div class="row" style="margin-top:13px"><button class="explain-link" data-go="lesson/${q.lesson}">이 개념 다시 읽기 ↗</button><button class="explain-link" data-copy-question="${q.id}">질문할 내용 복사</button></div></div>`:''}<div class="quiz-actions"><button class="btn secondary" data-quiz-prev ${s.index===0?'disabled':''}>← 이전</button><div class="row">${s.mode!=='exam'&&!checked?`<button class="btn" id="check-answer" ${selected===undefined?'disabled':''}>정답 확인</button>`:''}${s.mode==='exam'||checked?`<button class="btn" data-quiz-next>${s.index===s.ids.length-1?'채점하고 결과 보기':'다음 문제 →'}</button>`:''}</div></div>${s.mode==='exam'?`<div class="quiz-map" aria-label="시험 문항 이동">${s.ids.map((id,i)=>`<button class="${s.answers[id]!==undefined?'answered':''} ${i===s.index?'current':''}" data-jump="${i}" aria-label="${i+1}번 ${s.answers[id]!==undefined?'답 선택됨':'미응답'}">${i+1}</button>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:14px">답을 고른 뒤 자유롭게 이동할 수 있어. 제한시간이 끝나면 자동 채점돼.</p>`:'<p class="muted" style="font-size:11px;margin-top:17px">답을 고르고 정답을 확인하면 다음 문제로 넘어갈 수 있어.</p>'}</section><aside class="panel quiz-aside"><span class="eyebrow muted">${s.mode==='exam'?'TIME LEFT':'STUDY NOTE'}</span>${s.mode==='exam'?'<div class="timer num" id="timer-desktop" style="margin:15px 0"></div>':'<h3 style="margin:15px 0">한 문제씩,<br>내 속도로.</h3>'}<p class="muted" style="font-size:12px;line-height:1.9">${s.mode==='exam'?'재무회계 20문제<br>원가회계 20문제<br>과목별 40점 이상<br>전체 평균 60점 이상':'틀렸어도 해설을 읽어봐.<br>다음에 맞히면 오답노트에서<br>자동으로 빠져.'}</p><div style="border-top:1px solid var(--line);margin:18px 0"></div><small class="muted">선택한 답 ${Object.keys(s.answers).length} / ${s.ids.length}</small><button class="linkbtn" data-go="home" style="display:block;margin-top:18px">저장하고 공부방으로</button></aside></div>`;
 if(s.mode==='exam')tick();}
function checkAnswer(){const s=state.session;if(!s||s.mode==='exam')return;const q=getQ(s.ids[s.index]);if(s.answers[q.id]===undefined||s.checked[q.id])return;s.checked[q.id]=true;recordQuestion(q,s.answers[q.id]);persist();quiz();}
function finishSession(auto=false){const s=state.session;if(!s||s.finished)return;const unanswered=s.ids.filter(id=>s.answers[id]===undefined).length;const finish=()=>{if(s.mode==='exam')s.ids.forEach(id=>recordQuestion(getQ(id),s.answers[id]));s.finished=true;const result=calculate(s);if(!s.recorded){state.history.push({at:new Date().toISOString(),mode:s.mode,total:s.ids.length,score:result.score,financial:result.financial,cost:result.cost});state.history=state.history.slice(-100);s.recorded=true;}persist();go('result');if(auto)toast('제한시간이 끝나서 자동 채점했어.');};if(!auto&&s.mode==='exam')ask('시험을 제출할까?',unanswered?`아직 ${unanswered}문제가 미응답이야. 미응답은 오답으로 처리하고 채점해.`:'선택한 답으로 최종 채점할게.',finish);else finish();}
function calculate(s){const count=sub=>s.ids.filter(id=>!sub||getQ(id).subject===sub),right=ids=>ids.filter(id=>s.answers[id]===getQ(id).correct).length;const f=count('재무회계'),c=count('원가회계'),fscore=f.length?right(f)/f.length*100:0,cscore=c.length?right(c)/c.length*100:0;return{correct:right(s.ids),score:right(s.ids)/s.ids.length*100,financial:fscore,cost:cscore,ftotal:f.length,ctotal:c.length,pass:s.mode==='exam'&&fscore>=40&&cscore>=40&&(fscore+cscore)/2>=60};}
function result(){const s=state.session;if(!s){go('home');return;}if(!s.finished){go('quiz');return;}const r=calculate(s),wrong=s.ids.filter(id=>s.answers[id]!==getQ(id).correct);app.innerHTML=title('ONE MORE STEP','오늘도 한 걸음 쌓았어.',s.mode==='exam'?'자체 제작 문제로 연습한 결과야. 실제 합격을 보장하는 지표는 아니야.':'점수보다, 해설을 읽고 이해한 개념을 챙겨가자.')+`<section class="panel" style="max-width:850px"><span class="tag ${r.pass?'mint':'pink'}">${s.mode==='exam'?(r.pass?'모의시험 합격 기준 충족':'모의시험 합격 기준 미충족'):'연습 완료'}</span><div class="result-score">${Number(r.score.toFixed(1))}<span>점 / 100</span></div><p class="muted">전체 ${s.ids.length}문제 중 ${r.correct}문제 정답</p><div class="result-columns"><div class="result-sub"><small class="muted">재무회계 · ${r.ftotal}문제</small><strong>${r.ftotal?Number(r.financial.toFixed(1))+'점':'출제 없음'}</strong></div><div class="result-sub"><small class="muted">원가회계 · ${r.ctotal}문제</small><strong>${r.ctotal?Number(r.cost.toFixed(1))+'점':'출제 없음'}</strong></div></div>${s.mode==='exam'?'<p class="muted" style="font-size:12px">과목별 40점 이상이면서 전체 평균 60점 이상이면 기준 충족.</p>':''}<div class="row" style="margin-top:23px">${wrong.length?'<button class="btn" id="retry-wrong">이번 오답만 다시 풀기</button>':''}<button class="btn secondary" data-go="home">공부방으로</button><button class="btn secondary" data-go="sources">실제 기출 보기 ↗</button></div></section><div class="section-header"><h2>문제와 해설 다시 보기</h2></div><div class="panel" style="max-width:850px">${s.ids.map((id,i)=>{const q=getQ(id);return `<details class="review-item"><summary style="cursor:pointer;font-size:13px">${i+1}. ${s.answers[id]===q.correct?'✓ 정답':'다시 보기'} · ${esc(q.prompt)}</summary><p>내 답: ${esc(s.answers[id]===undefined?'미응답':q.choices[s.answers[id]])}<br>정답: ${esc(q.choices[q.correct])}</p><div class="explanation">${esc(q.explanation)}</div><button class="linkbtn" data-go="lesson/${q.lesson}">개념 다시 읽기 ↗</button></details>`;}).join('')}</div>`;if(wrong.length)$('#retry-wrong').onclick=()=>startSession('review',shuffle(wrong));}
function exam(){app.innerHTML=title('MOCK EXAM','실전처럼, 한 번 풀어볼까?','재무회계 20문제 + 원가회계 20문제. 60분 동안 답을 고르고 마지막에 채점해.')+`<div class="source-grid"><section class="panel"><div class="row between"><span class="eyebrow muted">LEVEL 02 / WRITTEN</span><span class="tag pink">유형 모의시험</span></div><h2 style="margin-top:17px">40문제 · 60분</h2><table class="info-table"><tr><th>문제 구성</th><td>재무회계 20 + 원가회계 20</td></tr><tr><th>선정 방식</th><td>과목별 20문제 무작위 추출</td></tr><tr><th>합격 기준</th><td>과목별 40점 이상 + 평균 60점 이상</td></tr><tr><th>채점 방식</th><td>과목당 1문제 5점, 미응답은 오답</td></tr></table><button class="btn" id="start-exam">모의시험 시작 ↗</button>${state.session?.mode==='exam'&&!state.session.finished?'<button class="btn secondary" data-go="quiz" style="margin-top:12px">풀던 시험 이어서</button>':''}</section><section class="panel"><span class="eyebrow muted">BEFORE YOU START</span><h3 style="margin:17px 0">알아두면 좋은 것</h3><ul style="padding-left:19px;font-size:13px;line-height:2.2;color:var(--sub)"><li>일반 계산기와 메모지를 준비해.</li><li>제출 전에는 답을 바꾸고 문항을 이동할 수 있어.</li><li>페이지를 나가도 타이머는 계속 흘러.</li><li>시간이 끝나면 미응답을 포함해 자동 채점해.</li><li>실제 CBT 프로그램과는 화면이 달라.</li></ul><div class="notice">이 모의시험은 자체 제작 160문제에서 추출해. 실제 기출·최신 복원문제는 자료실에서 별도로 확인해.</div><button class="linkbtn" data-go="sources">기출·복원자료 확인 ↗</button></section></div><div class="section-header"><h2>최근 시험 기록</h2></div><div class="panel">${state.history.filter(h=>h.mode==='exam').slice(-5).reverse().map(h=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--line)"><span class="muted" style="font-size:12px">${esc(new Date(h.at).toLocaleDateString('ko-KR'))}</span><strong>${Number(h.score.toFixed(1))}점</strong><span style="font-size:12px">재무 ${Number(h.financial.toFixed(1))} / 원가 ${Number(h.cost.toFixed(1))}</span></div>`).join('')||'<p class="muted" style="font-size:13px">아직 시험 기록이 없어. 준비되면 시작해 봐.</p>'}</div>`;$('#start-exam').onclick=()=>{const ids=[...shuffle(QUESTIONS.filter(q=>q.subject==='재무회계')).slice(0,20),...shuffle(QUESTIONS.filter(q=>q.subject==='원가회계')).slice(0,20)].map(q=>q.id);requestStart('exam',ids);};}
function review(){const list=QUESTIONS.filter(q=>reviewFilter==='saved'?state.bookmarks.includes(q.id):state.attempts[q.id]&&!state.attempts[q.id].correct);app.innerHTML=title('REVIEW & REMEMBER','다시 보면, 내 것이 돼.','마지막 풀이에서 틀린 문제를 모았어. 다시 맞히면 오답 목록에서 빠져.')+`<div class="filterbar"><button class="chip ${reviewFilter==='wrong'?'active':''}" data-review="wrong">오답 문제</button><button class="chip ${reviewFilter==='saved'?'active':''}" data-review="saved">별표한 문제</button><span class="muted" style="font-size:12px;margin-left:auto">${list.length}문제</span></div>${list.length?`<div class="row" style="margin-bottom:20px"><button class="btn" id="start-review">${reviewFilter==='wrong'?'오답':'저장한 문제'} 다시 풀기 ↗</button></div><div class="panel">${list.map(q=>`<article class="review-item"><div class="row between"><span class="tag ${q.subject==='원가회계'?'mint':'pink'}">${q.subject} · ${esc(LESSONS[q.lesson-1].title)}</span><button class="bookmark ${state.bookmarks.includes(q.id)?'on':''}" data-review-bookmark="${q.id}" aria-label="문제 별표 전환">${icon('star')}</button></div><p>${esc(q.prompt)}</p><details><summary style="font-size:12px;cursor:pointer;color:#87506a">정답과 해설 펼치기</summary><div class="explanation" style="margin-top:12px"><strong>정답: ${esc(q.choices[q.correct])}</strong><br>${esc(q.explanation)}</div></details><button class="linkbtn" data-go="lesson/${q.lesson}">연결 개념 다시 읽기 ↗</button></article>`).join('')}</div>`:`<div class="empty"><h3>${reviewFilter==='wrong'?'아직 다시 볼 오답이 없어.':'별표한 문제가 없어.'}</h3><p>${reviewFilter==='wrong'?'문제를 풀면 오답을 여기에 모아줄게.':'문제를 풀 때 별 버튼을 눌러 저장해 봐.'}</p><button class="btn secondary" data-go="practice">문제 풀러 가기</button></div>`}`;if(list.length)$('#start-review').onclick=()=>requestStart(reviewFilter==='wrong'?'review':'bookmarks',shuffle(list).map(q=>q.id));}

 {type:'past',tag:'기출 · 외부 CBT',title:'지난 기출, 회차별로 보기',desc:'전자문제집 CBT의 전산회계운용사 2급 자료실. 2020년·2019년 등 과거 회차를 제공해. 문제와 해설은 해당 사이트에서 확인하고, 개정된 기준과 차이가 있는지 살펴봐.',url:'https://www.comcbt.com/xe/g9',button:'회차별 기출 열기'},
 {type:'past',tag:'기출 · 외부 CBT',title:'2020년 3회 기출 해설',desc:'2020년 10월 9일 회차의 외부 기출 풀이 페이지야. 사용자 해설은 오류가 있을 수 있으니 공식 기준과 함께 확인해.',url:'https://www.comcbt.com/xe/webhaesul/9909253',button:'기출 원문 열기'},
 {type:'restore',tag:'복원 · 외부 출판자료',title:'복원문제 수록 자료 안내',desc:'출판사에서 안내하는 전산회계운용사 2급 복원문제 수록 교재 정보야. 원문 문제는 별도 교재·이용권이 필요할 수 있어. 이 사이트에 교재 문제를 복사해 넣지는 않았어.',url:'https://www.sdedu.co.kr/book/item.php?cat_id=001001012&it_id=1784509615',button:'출판사 복원자료 안내'},
 {type:'official',tag:'실기 · 공식 공개형',title:'2급 실기 공개형 자료',desc:'대한상공회의소 시험문제 목록에 SPLUS 2급 공개형이 있어. 실제 프로그램 연습은 PC에서 공식 자료와 해당 프로그램으로 진행해.',url:'https://license.korcham.net/co/examguide02.do?cd=0104&mm=41',button:'실기 공개자료 목록'}
];
function sources(){const list=SOURCES.filter(s=>sourceFilter==='all'||sourceFilter===s.type);app.innerHTML=title('SOURCES & PAST PAPERS','기출은 출처까지, 확실하게.','공식 공개자료, 과거 기출, 출판사 복원자료를 구분해서 모았어.')+`<div class="notice neutral"><strong>문제 구분을 먼저 확인해.</strong><br>이 사이트 안에서 푸는 160문제는 <strong>자체 제작 연습문제</strong>야. 실제 기출·복원문제는 아래 원문으로 연결돼. 상시시험 원문은 비공개이며, 출처 확인이 안 된 내용을 실제 복원문제로 표시하지 않았어.</div><div class="filterbar">${[['all','전체'],['official','공식·공개형'],['past','지난 기출'],['restore','복원자료']].map(([k,v])=>`<button class="chip ${sourceFilter===k?'active':''}" data-source-filter="${k}">${v}</button>`).join('')}</div><div class="source-grid">${list.map(s=>`<article class="source-card"><span class="tag ${s.type==='official'?'mint':'pink'}" style="align-self:start">${s.tag}</span><h3>${s.title}</h3><p>${s.desc}</p><a class="btn secondary small" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${s.button} ↗</a></article>`).join('')}</div><div class="section-header"><h2>시험 기본 정보</h2></div><div class="panel"><table class="info-table"><tr><th>필기</th><td>재무회계·원가회계 / 객관식 40문항 / 60분</td></tr><tr><th>필기 합격</th><td>각 과목 40점 이상, 전 과목 평균 60점 이상</td></tr><tr><th>실기</th><td>회계시스템의 운용 / 컴퓨터 작업형 / 80분</td></tr><tr><th>실기 합격</th><td>100점 만점에 70점 이상</td></tr></table><p class="muted" style="font-size:11px">확인 기준: 2026. 11. 15. · 출처: 대한상공회의소 자격평가사업단. 변경 시 공식 공지를 우선 확인해.</p></div>`;}
const GLOSSARY=[['분개','하나의 거래를 차변과 대변으로 나눠 적는 것.'],['차변·대변','장부의 왼쪽과 오른쪽. 좋고 나쁨을 뜻하지 않아.'],['자산','과거 사건으로 기업이 통제하는 현재의 경제적 자원. 현금·기계·받을 돈 등을 생각해.'],['부채','과거 사건으로 생긴, 자원을 이전해야 할 현재의무.'],['자본','자산에서 모든 부채를 뺀 나머지 몫.'],['수익·비용','기간의 성과를 늘리는 항목과 줄이는 항목. 현금 수입·지출 시점과 다를 수 있어.'],['감가상각','기계 같은 자산의 상각대상금액을 사용기간에 나눠 비용으로 처리하는 것.'],['매출채권·매입채무','팔고 받을 돈·사고 지급할 돈.'],['선급·선수','미리 지급한 것·미리 받은 것. 아직 사용·이행하지 않은 부분을 구분해.'],['원가','제품이나 서비스를 얻기 위해 사용한 자원의 가치.'],['재공품','제조가 아직 끝나지 않은 제품.'],['배부','여러 제품에 공통으로 든 원가를 일정한 기준으로 나누는 것.'],['완성품환산량','덜 완성된 제품을 완성품 몇 개 분량의 작업인지로 바꾼 수량.'],['분리점','공통 공정에서 생산된 제품들을 개별 제품으로 식별할 수 있게 되는 시점.']];
function settings(){app.innerHTML=title('MY LITTLE SETTINGS','내 속도에 맞춰서.','학습 기록은 지금 쓰는 브라우저에 저장돼. 다른 기기로 옮길 때는 백업을 이용해.')+`<section class="panel"><div class="settings-group"><h3>글씨 크기</h3><p>개념 설명과 문제의 글씨를 조금 더 크게 볼 수 있어.</p><button class="btn secondary" id="toggle-large" aria-pressed="${state.settings.large}">${state.settings.large?'기본 글씨로 바꾸기':'큰 글씨로 보기'}</button></div><div class="settings-group"><h3>기록 백업</h3><p>완료한 개념, 메모, 오답, 별표, 시험 기록을 JSON 파일로 내려받아. 다른 기기에서도 이 파일을 불러오면 이어갈 수 있어. 자동 기기 동기화는 지원하지 않아.</p><div class="row"><button class="btn" id="export-backup">기록 내보내기</button><button class="btn secondary" id="import-backup">백업 불러오기</button></div></div><div class="settings-group"><h3>저장된 기록</h3><p>현재 브라우저의 학습 기록을 처음 상태로 되돌릴 수 있어. 초기화 전에 백업해 두면 복원할 수 있어.</p><button class="btn danger small" id="reset-state">학습 기록 초기화</button></div></section><div class="section-header"><h2>작은 회계 사전</h2></div><div class="glossary">${GLOSSARY.map(([k,v])=>`<div><strong>${k}</strong><p>${v}</p></div>`).join('')}</div>`;$('#toggle-large').onclick=()=>{state.settings.large=!state.settings.large;persist();document.body.classList.toggle('large-text',state.settings.large);settings();};$('#export-backup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`chageun-records-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('학습 기록을 파일로 내보냈어.');};$('#import-backup').onclick=()=>$('#backup-file').click();$('#reset-state').onclick=()=>ask('학습 기록을 초기화할까?','이 브라우저의 개념 진도·메모·문제 기록·진행 중 시험이 모두 초기화돼. 저장해 둔 백업 파일로 복원할 수 있어.',()=>{state=fresh();persist();document.body.classList.remove('large-text');settings();toast('학습 기록을 초기화했어.');});}
$('#backup-file').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>2000000){toast('파일이 너무 커. 이 공부방의 백업 파일을 골라줘.');return;}try{const imported=normalize(JSON.parse(await f.text()));ask('백업 기록으로 바꿀까?','현재 브라우저의 기록이 선택한 백업 파일의 기록으로 교체돼.',()=>{state=imported;persist();document.body.classList.toggle('large-text',state.settings.large);render();toast('백업 기록을 불러왔어.');});}catch(e){toast('백업 형식을 확인할 수 없어. 내보낸 JSON 파일을 골라줘.');}});
document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-go]');if(!t)return;if(t.hasAttribute('data-go')){go(t.dataset.go);return;}if(t.hasAttribute('data-learn-filter')){learnFilter=t.dataset.learnFilter;learn();return;}if(t.hasAttribute('data-complete')){const id=Number(t.dataset.complete);state.completed=state.completed.includes(id)?state.completed.filter(n=>n!==id):[...state.completed,id];persist();t.textContent=state.completed.includes(id)?'✓ 이해한 개념':'이 개념 이해했어';toast(state.completed.includes(id)?'개념 하나, 내 것이 됐어.':'완료 표시를 해제했어.');return;}if(t.hasAttribute('data-cafe')){cafeStage=t.dataset.cafe==='reset'?0:Math.min(2,cafeStage+1);paintCafe();return;}if(t.hasAttribute('data-lesson-practice')){requestStart('lesson',QUESTIONS.filter(q=>q.lesson===Number(t.dataset.lessonPractice)).map(q=>q.id));return;}if(t.hasAttribute('data-source-filter')){sourceFilter=t.dataset.sourceFilter;sources();return;}if(t.hasAttribute('data-review')){reviewFilter=t.dataset.review;review();return;}if(t.hasAttribute('data-review-bookmark')){toggleBookmark(t.dataset.reviewBookmark);review();return;}if(t.hasAttribute('data-bookmark')){toggleBookmark(t.dataset.bookmark);quiz();return;}if(t.hasAttribute('data-answer')){const s=state.session;if(!s||s.finished)return;const id=s.ids[s.index];if(s.checked[id])return;s.answers[id]=Number(t.dataset.answer);persist();quiz();return;}if(t.id==='check-answer'){checkAnswer();return;}if(t.hasAttribute('data-quiz-prev')){state.session.index--;persist();quiz();return;}if(t.hasAttribute('data-quiz-next')){const s=state.session;if(s.index===s.ids.length-1)finishSession();else{s.index++;persist();quiz();window.scrollTo({top:0,behavior:'instant'});}return;}if(t.hasAttribute('data-jump')){state.session.index=Number(t.dataset.jump);persist();quiz();return;}if(t.hasAttribute('data-copy-question')){const q=getQ(t.dataset.copyQuestion),text=`전산회계운용사 2급 기초를 배우는 중이야. 아래 문제를 쉬운 말과 새로운 예시로 다시 설명해줘.\n문제: ${q.prompt}\n정답: ${q.choices[q.correct]}\n해설: ${q.explanation}`;try{await navigator.clipboard.writeText(text);toast('복사했어. 채팅에 붙여 넣으면 돼.');}catch(e){toast('복사가 제한됐어. 문제와 해설을 선택해서 복사해 줘.');}}});
function toggleBookmark(id){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];persist();}
function tick(){const s=state.session;if(!s||s.mode!=='exam'||s.finished)return;const remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));const time=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');for(const el of document.querySelectorAll('#timer-mobile,#timer-desktop')){el.textContent=time;el.classList.toggle('urgent',remaining<=300);}if(remaining===0){$('#confirm-dialog').close();finishSession(true);}}
setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
function render(){const hash=location.hash.slice(1)||'home';const parts=hash.split('/');view=parts[0];if(!['home','learn','lesson','practice','exam','quiz','result','review','sources','settings'].includes(view)){go('home');return;}document.body.classList.toggle('large-text',state.settings.large);nav();if(view==='home')home();if(view==='learn')learn();if(view==='lesson')lessonView(Number(parts[1]));if(view==='practice')practice();if(view==='exam')exam();if(view==='quiz')quiz();if(view==='result')result();if(view==='review')review();if(view==='sources')sources();if(view==='settings')settings();document.title=(view==='lesson'?(LESSONS.find(l=>l.id===Number(parts[1]))?.title||'개념'):pages.find(([id])=>id===view)?.[1]||'나의 공부')+' — 차근회계';}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
$('#date').textContent=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase();render();tick();
</script>
</body>
